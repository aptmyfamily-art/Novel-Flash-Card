<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>Novel Flashcard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <?!= include("Styles") ?>
</head>
<body>
  <div id="boot-loader" class="boot-loader" aria-hidden="false">
    <div class="bl-logo"><i class="bi bi-book-half"></i></div>
    <div class="bl-name">Novel Flashcard</div>
    <div class="bl-sub">Chinese Reading + Vocabulary Trainer</div>
    <div class="bl-dots"><span></span><span></span><span></span></div>
    <div class="bl-text" id="bl-text">กำลังเริ่มระบบ...</div>
  </div>

  <header class="topbar">
    <h1><i class="bi bi-journal-text"></i> Novel Flashcard</h1>
    <div class="top-actions">
      <button id="btn-import-cedict" type="button">โหลด CEDICT</button>
      <div id="status">Ready</div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sb-brand">
        <div class="sb-logo"><i class="bi bi-book"></i></div>
        <div>
          <div class="sb-title">Novel Flashcard</div>
          <div class="sb-sub">ระบบฝึกคำศัพท์นิยาย</div>
        </div>
      </div>
      <div class="sb-section">ภาพรวม</div>
      <nav class="sb-nav">
        <a href="#reader-panel"><i class="bi bi-grid-1x2-fill"></i> แดชบอร์ด</a>
      </nav>
      <div class="sb-section">งานหลัก</div>
      <nav class="sb-nav">
        <a href="#novel-panel" class="is-active"><i class="bi bi-collection-fill"></i> จัดการนิยาย</a>
        <a href="#episode-panel"><i class="bi bi-journal-plus"></i> เพิ่มตอนใหม่</a>
      </nav>
      <div class="sb-section">ข้อมูลหลัก</div>
      <nav class="sb-nav">
        <a href="#reader-panel"><i class="bi bi-translate"></i> Reader + Popup</a>
        <a href="#reader-panel"><i class="bi bi-bookmark-heart"></i> คำที่สนใจ</a>
      </nav>
      <div class="sb-quick">
        <div class="sb-quick-title">เมนูด่วน</div>
        <button type="button" id="sb-import-cedict"><i class="bi bi-database-down"></i> โหลด CEDICT</button>
        <button type="button" id="sb-go-novel"><i class="bi bi-plus-circle"></i> เพิ่มนิยายใหม่</button>
        <button type="button" id="sb-go-episode"><i class="bi bi-file-earmark-plus"></i> เพิ่มตอนใหม่</button>
      </div>
    </aside>

    <section id="novel-panel" class="panel">
      <h2>นิยาย</h2>
      <form id="novel-form" class="stack">
        <input id="novel-title" placeholder="ชื่อนิยาย" required>
        <textarea id="novel-description" placeholder="คำอธิบาย"></textarea>
        <button type="submit">เพิ่มนิยาย</button>
      </form>
      <select id="novel-select" size="8"></select>
    </section>

    <section id="episode-panel" class="panel">
      <h2>ตอน</h2>
      <form id="episode-form" class="stack">
        <input id="episode-no" type="number" min="1" placeholder="ตอนที่" required>
        <input id="episode-title" placeholder="ชื่อตอน" required>
        <textarea id="episode-content" placeholder="วางเนื้อหาภาษาจีนที่นี่" required></textarea>
        <button type="submit">เพิ่มตอน</button>
      </form>
      <select id="episode-select" size="8"></select>
    </section>

    <section id="reader-panel" class="panel reader-panel">
      <h2>Reader</h2>
      <div id="reader" class="reader"></div>
      <h3>คำที่สนใจ</h3>
      <div id="fav-list" class="fav-list"></div>
    </section>
  </main>

  <div id="spinner-overlay" class="spinner-overlay" hidden>
    <div class="qspin">
      <div class="qspin-ring qspin-r1"></div>
      <div class="qspin-ring qspin-r2"></div>
      <div class="qspin-ring qspin-r3"></div>
      <div class="qspin-pulse"></div>
      <div class="qspin-core"><i class="bi bi-translate"></i></div>
    </div>
    <div class="qspin-msg" id="qspin-msg">กำลังประมวลผล...</div>
  </div>

  <div id="popup" class="popup" hidden>
    <div><strong id="pv-word"></strong></div>
    <div id="pv-en"></div>
    <div id="pv-th"></div>
    <div class="row">
      <input id="pv-note" placeholder="โน้ต">
      <button id="pv-save">บันทึกคำนี้</button>
    </div>
  </div>

  <?!= include("Scripts") ?>
</body>
</html>
