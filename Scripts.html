<script>
/* ═══════════════════════════════════════════════════════════════
   SHVR · Bootstrap Loader — keep this file <25 lines of ES5
   ═══════════════════════════════════════════════════════════════ */
(function () {
  function setText(t) { var el = document.getElementById('bl-text'); if (el) el.textContent = t; }
  function start() {
    try {
      var scripts = document.querySelectorAll('script[type^="text/x-shvr"]');
      if (!scripts.length) { setText('❌ ไม่พบ inert script blocks'); return; }
      for (var i = 0; i < scripts.length; i++) {
        var src = scripts[i].textContent || '';
        if (!src) continue;
        var s = document.createElement('script');
        s.text = src;
        document.body.appendChild(s);
      }
      setTimeout(function () {
        if (typeof window.SHVR_boot === 'function' && !window.__shvrBootCalled) {
          window.__shvrBootCalled = true; window.SHVR_boot();
        }
      }, 200);
    } catch (e) { setText('❌ Bootstrap error: ' + (e && e.message ? e.message : e)); }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, false);
  else start();
})();
</script>
