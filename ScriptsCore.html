<script type="text/x-shvr-core" id="shvr-core-script">
(function () {
  'use strict';

  var Store = window.Store = {
    boot: null,
    user: null,
    token: '',
    caps: [],
    academic_year: '',
    cache: {}
  };

  var Routes = window.Routes = {};

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  var TH = window.TH = {
    MONTHS_SHORT: ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'],
    parse: function (v) {
      if (!v) return null;
      var d = v instanceof Date ? v : new Date(v);
      return isNaN(d.getTime()) ? null : d;
    },
    date: function (v) {
      var d = TH.parse(v);
      if (!d) return '-';
      return d.getDate() + ' ' + TH.MONTHS_SHORT[d.getMonth()] + ' ' + (d.getFullYear() + 543);
    },
    smart: function (v) {
      var d = TH.parse(v);
      if (!d) return '-';
      var diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff >= 0 && diff < 60) return diff + ' วินาทีที่แล้ว';
      if (diff < 3600) return Math.floor(diff / 60) + ' นาทีที่แล้ว';
      if (diff < 86400) return Math.floor(diff / 3600) + ' ชั่วโมงที่แล้ว';
      if (diff < 86400 * 7) return Math.floor(diff / 86400) + ' วันที่แล้ว';
      return TH.date(d);
    }
  };

  function call(action, payload, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () {
        if (!settled) {
          settled = true;
          reject(new Error('คำขอหมดเวลา: ' + action));
        }
      }, timeoutMs || 30000);

      if (!window.google || !google.script || !google.script.run) {
        clearTimeout(timer);
        reject(new Error('ไม่พบ google.script.run'));
        return;
      }

      google.script.run
        .withSuccessHandler(function (res) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (!res) return reject(new Error('ไม่พบ response จาก server'));
          if (res.ok) resolve(res.data);
          else reject(new Error(res.error || 'เกิดข้อผิดพลาด'));
        })
        .withFailureHandler(function (e) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(new Error(e && e.message ? e.message : String(e)));
        })
        .api({ action: action, token: Store.token, payload: payload || {} });
    });
  }

  function hasCap(cap) {
    if (!cap || cap === '*') return true;
    var caps = Store.caps || [];
    return cap.split('|').some(function (item) {
      if (caps.indexOf(item) >= 0) return true;
      var dot = item.indexOf('.');
      return dot > 0 && caps.indexOf(item.slice(0, dot) + '.manage') >= 0;
    });
  }

  function toast(msg, type, dur) {
    if (!window.Swal) return;
    Swal.fire({
      toast: true,
      position: 'top-end',
      icon: type || 'info',
      title: msg,
      showConfirmButton: false,
      timer: dur || 2400,
      timerProgressBar: true
    });
  }
  function alertSuccess(title, text) { return Swal.fire({ icon: 'success', title: title, text: text || '', confirmButtonText: 'ตกลง' }); }
  function alertError(title, text) { return Swal.fire({ icon: 'error', title: title, text: text || '', confirmButtonText: 'ตกลง' }); }
  function alertInfo(title, text) { return Swal.fire({ icon: 'info', title: title, text: text || '', confirmButtonText: 'ตกลง' }); }
  function confirmModal(opts) {
    opts = opts || {};
    return Swal.fire({
      icon: opts.danger ? 'warning' : 'question',
      title: opts.title || 'ยืนยัน',
      text: opts.message || '',
      showCancelButton: true,
      confirmButtonText: opts.okText || 'ตกลง',
      cancelButtonText: opts.cancelText || 'ยกเลิก',
      reverseButtons: true
    }).then(function (r) { return !!r.isConfirmed; });
  }

  var Spinner = window.Spinner = {
    show: function (msg) {
      var host = $('#spinner-overlay');
      if (host) host.hidden = false;
      var el = $('#qspin-msg');
      if (el) el.textContent = msg || 'กำลังประมวลผล...';
    },
    hide: function () {
      var host = $('#spinner-overlay');
      if (host) host.hidden = true;
    }
  };

  var Modal = window.Modal = {
    open: function (opts) {
      opts = opts || {};
      var host = $('#modal-host');
      host.innerHTML = '<div class="modal-backdrop" data-modal-close></div>'
        + '<div class="modal-card' + (opts.large ? ' is-large' : '') + '">'
        + '<div class="md-header"><div class="md-title">' + esc(opts.title || '') + '</div>'
        + '<button class="md-close" data-modal-close><i class="bi bi-x-lg"></i></button></div>'
        + '<div class="md-body">' + (opts.html || '') + '</div>'
        + (opts.footer ? '<div class="md-footer">' + opts.footer + '</div>' : '')
        + '</div>';
      host.classList.add('is-open');
      if (typeof opts.onOpen === 'function') setTimeout(opts.onOpen, 10);
    },
    close: function () {
      var host = $('#modal-host');
      if (!host) return;
      host.innerHTML = '';
      host.classList.remove('is-open');
    }
  };

  if (!window.__nvfsClickWired) {
    window.__nvfsClickWired = true;
    document.addEventListener('click', function (e) {
      var close = e.target.closest && e.target.closest('[data-modal-close]');
      if (close) { Modal.close(); return; }

      var actEl = e.target.closest && e.target.closest('[data-action]');
      if (actEl) {
        var act = actEl.getAttribute('data-action');
        if (act === 'logout') { e.preventDefault(); doLogout(); return; }
        if (act === 'open-sidebar') { e.preventDefault(); openSidebar(); return; }
        if (act === 'close-sidebar') { e.preventDefault(); closeSidebar(); return; }
        if (act === 'toggle-profile') { e.preventDefault(); toggleProfilePopover(); return; }
      }

      var pp = $('.nav-profile-popover');
      if (pp && !e.target.closest('.nav-profile-popover') && !e.target.closest('.nav-profile')) pp.remove();

      var a = e.target.closest && e.target.closest('a[href]');
      if (a) {
        var href = a.getAttribute('href');
        if (href && href.charAt(0) === '#') {
          if (href === '#') return;
          if (a.target && a.target !== '_top' && a.target !== '_self') return;
          e.preventDefault();
          if (window.innerWidth <= 1024) closeSidebar();
          if (href === location.hash) dispatch();
          else location.hash = href;
        }
      }
    }, true);
    window.addEventListener('hashchange', dispatch);
  }

  function saveSession(token, user, caps) {
    Store.token = token || '';
    Store.user = user || null;
    Store.caps = caps || [];
    try { localStorage.setItem('shvr.token', Store.token); } catch (e) {}
  }
  function loadSession() {
    try { return localStorage.getItem('shvr.token') || ''; } catch (e) { return ''; }
  }
  function clearSession() {
    Store.token = '';
    Store.user = null;
    Store.caps = [];
    try { localStorage.removeItem('shvr.token'); } catch (e) {}
  }

  function makeParticles(n) {
    var out = '';
    for (var i = 0; i < n; i++) {
      out += '<span style="left:' + Math.floor(Math.random() * 100) + '%;animation-duration:' + (12 + Math.floor(Math.random() * 10)) + 's;animation-delay:-' + Math.floor(Math.random() * 10) + 's"></span>';
    }
    return out;
  }

  function featCard(icon, title, desc) {
    return '<div class="lb-feat"><div class="lb-feat-icon"><i class="bi ' + icon + '"></i></div>'
      + '<div><div class="lb-feat-title">' + esc(title) + '</div><div class="lb-feat-desc">' + esc(desc) + '</div></div></div>';
  }

  function demoCardsHtml() {
    var users = [
      { username: 'admin', role: 'admin', label: 'Admin', icon: 'bi-shield-fill-check' },
      { username: 'director', role: 'director', label: 'Director', icon: 'bi-award-fill' },
      { username: 'academic', role: 'academic', label: 'Academic', icon: 'bi-journal-check' },
      { username: 'teacher', role: 'teacher', label: 'User', icon: 'bi-person-fill' }
    ];
    return '<div class="lf-demo"><div class="lf-demo-head"><i class="bi bi-stars"></i> Demo Accounts</div><div class="lf-demo-grid">'
      + users.map(function (u) {
          return '<button type="button" class="lf-demo-card" data-user="' + u.username + '">'
            + '<div class="lf-demo-icon"><i class="bi ' + u.icon + '"></i></div>'
            + '<div class="lf-demo-role">' + esc(u.label) + '</div>'
            + '<div class="lf-demo-user">' + esc(u.username) + '</div></button>';
        }).join('')
      + '</div><div class="lf-demo-note">รหัสผ่านเริ่มต้น: <strong>123456</strong></div></div>';
  }

  function renderLogin() {
    var host = $('#app-host');
    var boot = Store.boot || {};
    var app = boot.app || {};
    var dev = boot.dev || {};
    var settings = boot.settings || {};
    var html = '<div class="login-stage"><div class="login-particles">' + makeParticles(18) + '</div><div class="login-shell">'
      + '<div class="lb-panel"><div class="lb-brand"><div class="lb-logo"><i class="bi bi-journal-richtext"></i></div>'
      + '<div><div class="lb-app-name">' + esc(app.short || 'NVFS') + '</div><div class="lb-app-sub">' + esc(app.name || '') + '</div></div></div>'
      + '<div class="lb-tagline">เหลือแค่ <span>core UI</span><br>พร้อมเริ่มระบบ import</div>'
      + '<div class="lb-features">'
      + featCard('bi-shield-check', 'Auth ยังอยู่', 'ล็อกอิน ผู้ใช้ สิทธิ์ และ session ใช้งานต่อได้')
      + featCard('bi-box-arrow-in-down', 'Import First', 'เริ่มระบบแรกด้วย Yomitan / CC-CEDICT import')
      + featCard('bi-sliders', 'Core Settings', 'คงไว้เฉพาะค่ากลางที่ต้องใช้จริง')
      + featCard('bi-clipboard-data', 'Audit พร้อม', 'ตรวจดูการเปลี่ยนแปลงในระบบได้')
      + '</div>'
      + '<div class="lb-stats"><div><div class="lb-stat-val">Core</div><div class="lb-stat-lbl">UI Shell</div></div><div><div class="lb-stat-val">Import</div><div class="lb-stat-lbl">First System</div></div><div><div class="lb-stat-val">Drive</div><div class="lb-stat-lbl">Ready</div></div></div></div>'
      + '<div class="lf-card"><div><div class="lf-title">เข้าสู่ระบบ</div><div class="lf-sub">ใช้งาน auth เดิม แล้วเริ่มจากงาน import</div></div>'
      + '<form class="lf" id="login-form" novalidate>'
      + '<div class="lf-input-wrap"><i class="lf-icon bi bi-person-fill"></i><input class="lf-input" type="text" name="username" placeholder="Username" autocomplete="username" required></div>'
      + '<div class="lf-input-wrap"><i class="lf-icon bi bi-lock-fill"></i><input class="lf-input" type="password" name="password" placeholder="Password" autocomplete="current-password" required><button type="button" class="lf-toggle" data-toggle-pwd tabindex="-1"><i class="bi bi-eye"></i></button></div>'
      + '<button type="submit" class="lf-submit" id="lf-submit"><span class="lf-submit-state lf-submit-state-default"><i class="bi bi-box-arrow-in-right"></i> เข้าสู่ระบบ</span><span class="lf-submit-state lf-submit-state-loading">กำลังตรวจสอบ...</span></button>'
      + '</form>'
      + (String(settings.show_demo_users || 'yes').toLowerCase() === 'yes' ? demoCardsHtml() : '')
      + '</div></div>'
      + '<div class="login-footer"><div class="lf-copy">' + esc(app.name || 'NVFS') + ' v' + esc(app.version || '1.0.0') + ' <strong style="color:#fbbf24">DEPLOY PROBE 817094d</strong></div>'
      + '<div class="lf-dev"><a href="' + esc(dev.URL || '#') + '" target="_blank" rel="noopener noreferrer" class="lf-dev-link"><img class="lf-dev-logo dev-logo-img" src="' + esc(dev.LOGO || '') + '" alt=""></a></div></div></div>';
    host.innerHTML = html;

    var form = $('#login-form');
    var toggle = $('[data-toggle-pwd]');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var input = form.password;
        input.type = input.type === 'password' ? 'text' : 'password';
        toggle.innerHTML = '<i class="bi bi-' + (input.type === 'password' ? 'eye' : 'eye-slash') + '"></i>';
      });
    }

    $$('.lf-demo-card').forEach(function (btn) {
      btn.addEventListener('click', function () {
        form.username.value = btn.getAttribute('data-user');
        form.password.value = '123456';
      });
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var submit = $('#lf-submit');
      submit.setAttribute('data-state', 'loading');
      call('auth.login', { username: form.username.value, password: form.password.value }, 15000).then(function (data) {
        saveSession(data.token, data.user, data.caps);
        Store.boot.me = data.user;
        renderShell();
      }).catch(function (err) {
        submit.removeAttribute('data-state');
        alertError('ล็อกอินไม่สำเร็จ', err.message);
      });
    });
  }

  var MENU_GROUPS = [
    { title: 'Workspace', items: [{ hash: '#/dashboard', icon: 'bi-grid-fill', label: 'Dashboard', cap: '*' }, { hash: '#/import', icon: 'bi-box-arrow-in-down', label: 'Import', cap: '*' }] },
    { title: 'System', items: [{ hash: '#/users', icon: 'bi-people-fill', label: 'Users', cap: 'user.manage' }, { hash: '#/settings', icon: 'bi-sliders', label: 'Settings', cap: 'setting.manage' }, { hash: '#/audit', icon: 'bi-clipboard-data-fill', label: 'Audit', cap: 'audit.view_all' }] },
    { title: 'Account', items: [{ hash: '#/profile', icon: 'bi-person-circle', label: 'Profile', cap: '*' }] }
  ];

  var PAGE_META = {
    '#/dashboard': { title: 'Core Dashboard', sub: 'หน้าแกนระบบหลังตัดส่วนเยี่ยมบ้านออก', icon: 'bi-grid-fill' },
    '#/import': { title: 'Import Dictionary', sub: 'นำเข้าข้อมูล Yomitan / CC-CEDICT', icon: 'bi-box-arrow-in-down' },
    '#/users': { title: 'Users', sub: 'จัดการผู้ใช้ของระบบ', icon: 'bi-people-fill' },
    '#/settings': { title: 'Settings', sub: 'ตั้งค่าระบบกลาง', icon: 'bi-sliders' },
    '#/audit': { title: 'Audit Log', sub: 'ประวัติการเปลี่ยนแปลง', icon: 'bi-clipboard-data-fill' },
    '#/profile': { title: 'Profile', sub: 'ข้อมูลส่วนตัว', icon: 'bi-person-circle' },
    '#/change-password': { title: 'Change Password', sub: 'อัปเดตรหัสผ่าน', icon: 'bi-key-fill' }
  };

  function renderShell() {
    if (!Store.user) return renderLogin();
    var host = $('#app-host');
    var u = Store.user;
    var roleLabel = (Store.boot.roles && Store.boot.roles[u.role]) || u.role;

    var sidebar = '<aside class="sidebar" id="sidebar"><div class="sb-power"><div class="sb-brand"><div class="sb-brand-logo"><i class="bi bi-journal-richtext"></i></div>'
      + '<div><div class="sb-brand-name">' + esc(Store.boot.app.short || 'NVFS') + '</div><div class="sb-brand-org">' + esc(Store.boot.app.name || '') + '</div></div></div>'
      + '<div class="sb-user"><div class="sb-avatar">' + esc((u.full_name || '?').charAt(0)) + '</div><div style="flex:1;min-width:0"><div class="sb-user-name">' + esc(u.full_name || '') + '</div><span class="role-chip role-chip-' + esc(u.role) + '"><i class="bi bi-shield-check"></i> ' + esc(roleLabel) + '</span></div></div></div>'
      + '<nav class="sb-nav">'
      + MENU_GROUPS.map(function (group) {
          var items = group.items.filter(function (item) { return hasCap(item.cap); });
          if (!items.length) return '';
          return '<div class="sb-group"><div class="sb-group-head">' + esc(group.title) + '</div>' + items.map(function (item) {
            return '<a class="sb-link" href="' + item.hash + '"><i class="bi ' + item.icon + '"></i> ' + esc(item.label) + '</a>';
          }).join('') + '</div>';
        }).join('')
      + '<div class="sb-group"><div class="sb-group-head">Session</div><a class="sb-link is-logout" href="#" data-action="logout"><i class="bi bi-box-arrow-right"></i> Logout</a></div>'
      + '</nav></aside>';

    var navbar = '<header class="navbar" id="navbar"><button class="nav-burger" data-action="open-sidebar"><i class="bi bi-list"></i></button>'
      + '<div class="nav-page-card" id="nav-page-icon"><i class="bi bi-grid-fill"></i></div><div><div class="nav-page-title" id="nav-page-title">-</div><div class="nav-page-sub" id="nav-page-sub">-</div></div>'
      + '<div style="margin-left:auto;display:flex;align-items:center;gap:10px"><div style="font-size:11px;font-weight:800;color:#b45309;background:#fef3c7;border:1px solid #f59e0b;border-radius:999px;padding:6px 10px">DEPLOY PROBE 817094d</div><div class="nav-profile" data-action="toggle-profile"><div class="nav-profile-avatar">' + esc((u.full_name || '?').charAt(0)) + '</div><div class="nav-profile-name">' + esc((u.full_name || '').split(' ')[0] || u.username || '') + '</div></div></div></header>';

    var footer = '<footer class="app-footer"><div>' + esc(Store.boot.app.name || 'NVFS') + ' <span class="af-version">v' + esc(Store.boot.app.version || '1.0.0') + '</span> <strong style="color:#b45309">DEPLOY PROBE 817094d</strong></div></footer>';
    var bottomNav = '<nav class="bottom-nav" id="bottom-nav">'
      + bnItem('#/dashboard', 'bi-grid-fill', 'Dashboard')
      + bnItem('#/import', 'bi-box-arrow-in-down', 'Import')
      + bnItem('#/users', 'bi-people-fill', 'Users')
      + bnItem('#/profile', 'bi-person-circle', 'Profile')
      + bnItem('#', 'bi-list', 'Menu', 'open-sidebar')
      + '</nav>';

    host.innerHTML = '<div class="shell">' + sidebar + '<div class="main-area">' + navbar + '<div class="page-wrap" id="page">' + skeletonDashboard() + '</div>' + footer + '</div></div>'
      + '<div class="sidebar-backdrop" id="sidebar-backdrop" data-action="close-sidebar"></div>' + bottomNav;
    if (!location.hash || location.hash === '#') location.hash = '#/dashboard';
    else dispatch();
  }

  function bnItem(hash, icon, label, action) {
    return '<a class="bn-item" href="' + hash + '"' + (action ? ' data-action="' + action + '"' : '') + '><i class="bi ' + icon + '"></i><span>' + esc(label) + '</span></a>';
  }

  function openSidebar() {
    var s = $('#sidebar'); if (s) s.classList.add('is-open');
    var b = $('#sidebar-backdrop'); if (b) b.classList.add('is-open');
  }

  function closeSidebar() {
    var s = $('#sidebar'); if (s) s.classList.remove('is-open');
    var b = $('#sidebar-backdrop'); if (b) b.classList.remove('is-open');
  }

  function toggleProfilePopover() {
    var existing = $('.nav-profile-popover');
    if (existing) { existing.remove(); return; }
    var u = Store.user || {};
    var pop = document.createElement('div');
    pop.className = 'nav-profile-popover';
    pop.innerHTML = '<div class="npp-head">'
      + '<div class="nav-profile-avatar">' + esc((u.full_name || '?').charAt(0)) + '</div>'
      + '<div><div class="npp-name">' + esc(u.full_name || '-') + '</div><div class="npp-email">' + esc(u.email || u.username || '') + '</div>'
      + '<span class="role-chip role-chip-' + esc(u.role || '') + '"><i class="bi bi-shield-check"></i> ' + esc((Store.boot.roles && Store.boot.roles[u.role]) || u.role || '') + '</span></div></div>'
      + '<a class="npp-item" href="#/profile"><i class="bi bi-person-circle"></i> Profile</a>'
      + '<a class="npp-item" href="#/change-password"><i class="bi bi-key-fill"></i> Change Password</a>'
      + '<div style="border-top:1px solid var(--line);margin:6px 0"></div>'
      + '<a class="npp-item is-danger" href="#" data-action="logout"><i class="bi bi-box-arrow-right"></i> Logout</a>';
    document.body.appendChild(pop);
  }

  function doLogout() {
    confirmModal({ title: 'ออกจากระบบ', message: 'ต้องการออกจากระบบหรือไม่' }).then(function (ok) {
      if (!ok) return;
      call('auth.logout', {}).catch(function () {});
      clearSession();
      history.replaceState(null, '', location.pathname + location.search);
      var pp = $('.nav-profile-popover'); if (pp) pp.remove();
      closeSidebar();
      renderLogin();
    });
  }

  function dispatch() {
    if (!Store.user) return renderLogin();
    var hash = (location.hash || '#/dashboard').split('?')[0];
    var rawHash = location.hash || '#/dashboard';
    var handler = Routes[hash] || Routes['#/dashboard'];
    var meta = PAGE_META[hash] || PAGE_META['#/dashboard'];
    var title = $('#nav-page-title');
    var sub = $('#nav-page-sub');
    var icon = $('#nav-page-icon');
    if (title) title.textContent = meta.title;
    if (sub) sub.textContent = meta.sub;
    if (icon) icon.innerHTML = '<i class="bi ' + meta.icon + '"></i>';
    $$('.sb-link').forEach(function (link) { link.classList.toggle('is-active', link.getAttribute('href') === hash); });
    $$('.bn-item').forEach(function (link) { link.classList.toggle('is-active', link.getAttribute('href') === hash); });
    closeSidebar();
    handler(rawHash);
  }

  function skeletonDashboard() {
    return '<div class="sk sk-block" style="height:140px;border-radius:22px;margin-bottom:16px"></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px"><div class="sk sk-block"></div><div class="sk sk-block"></div><div class="sk sk-block"></div></div>';
  }

  function uploadFile(file, subfolder) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('ไม่พบไฟล์'));
      var reader = new FileReader();
      reader.onload = function () {
        call('file.upload', { name: file.name, data: reader.result, subfolder: subfolder || 'uploads' }, 60000).then(resolve).catch(reject);
      };
      reader.onerror = function () { reject(new Error('อ่านไฟล์ไม่สำเร็จ')); };
      reader.readAsDataURL(file);
    });
  }

  function pageHero(title, sub, icon, kpis) {
    var html = '<div class="hero"><div class="hero-pill"><i class="bi ' + (icon || 'bi-grid-fill') + '"></i> ' + esc(title) + '</div>'
      + '<div class="hero-title">' + esc(title) + '</div><div class="hero-sub">' + esc(sub || '') + '</div>';
    if (kpis && kpis.length) {
      html += '<div class="kpi-grid">' + kpis.map(function (k) {
        return '<div class="kpi"><div class="kpi-icon" style="background:linear-gradient(135deg,' + (k.color1 || '#6366f1') + ',' + (k.color2 || '#8b5cf6') + ')"><i class="bi ' + esc(k.icon || 'bi-circle') + '"></i></div><div class="kpi-val">' + esc(k.val) + '</div><div class="kpi-lbl">' + esc(k.lbl) + '</div></div>';
      }).join('') + '</div>';
    }
    return html + '</div>';
  }

  function roleChip(role) {
    var label = (Store.boot.roles && Store.boot.roles[role]) || role;
    return '<span class="role-chip role-chip-' + esc(role) + '"><i class="bi bi-shield-check"></i> ' + esc(label) + '</span>';
  }

  function formatNum(n) {
    if (n == null || n === '') return '-';
    return Number(n).toLocaleString('th-TH');
  }

  function qaCard(hash, icon, label, color1, color2, cap) {
    if (!hasCap(cap)) return '';
    return '<a class="qa-card" href="' + hash + '"><div class="qa-card-inner"><div class="qa-card-icon" style="background:linear-gradient(135deg,' + color1 + ',' + color2 + ')"><i class="bi ' + icon + '"></i></div><div class="qa-card-label">' + esc(label) + '</div></div></a>';
  }

  function boot() {
    var loader = $('#boot-loader');
    Store.token = loadSession();
    call('app.bootstrap', {}, 20000).then(function (data) {
      Store.boot = data;
      Store.user = data.me || null;
      Store.caps = data.caps || [];
      if (loader) loader.style.display = 'none';
      if (Store.user) renderShell();
      else renderLogin();
    }).catch(function (e) {
      if (loader) {
        loader.style.display = 'flex';
        $('#bl-text').textContent = e.message || 'Bootstrap failed';
      }
    });
  }

  window.SHVR_boot = boot;
  window.SHVR = {
    Store: Store,
    Routes: Routes,
    TH: TH,
    call: call,
    hasCap: hasCap,
    toast: toast,
    alertSuccess: alertSuccess,
    alertError: alertError,
    alertInfo: alertInfo,
    confirmModal: confirmModal,
    Spinner: Spinner,
    Modal: Modal,
    uploadFile: uploadFile,
    pageHero: pageHero,
    roleChip: roleChip,
    formatNum: formatNum,
    qaCard: qaCard,
    skeletonDashboard: skeletonDashboard,
    dispatch: dispatch,
    renderShell: renderShell,
    renderLogin: renderLogin,
    toggleProfilePopover: toggleProfilePopover,
    doLogout: doLogout,
    $: $,
    $$: $$,
    esc: esc
  };

  window.$ = $;
  window.$$ = $$;
  window.esc = esc;
  window.call = call;
  window.hasCap = hasCap;
  window.toast = toast;
  window.alertSuccess = alertSuccess;
  window.alertError = alertError;
  window.alertInfo = alertInfo;
  window.confirmModal = confirmModal;
  window.pageHero = pageHero;
  window.roleChip = roleChip;
  window.formatNum = formatNum;
  window.qaCard = qaCard;
  window.skeletonDashboard = skeletonDashboard;
  window.uploadFile = uploadFile;
})();
</script>
