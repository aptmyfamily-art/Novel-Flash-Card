<script type="text/x-shvr-pages" id="shvr-pages-script">
(function () {
  'use strict';

  function field(label, control, hint) {
    return '<div class="field"><label class="label">' + label + '</label>' + control
      + (hint ? '<div class="hint">' + esc(hint) + '</div>' : '') + '</div>';
  }

  function formToObj(form) {
    var out = {};
    if (!form) return out;
    Array.prototype.slice.call(form.elements || []).forEach(function (el) {
      if (!el.name || el.disabled) return;
      if (el.type === 'checkbox') out[el.name] = !!el.checked;
      else out[el.name] = el.value;
    });
    return out;
  }

  function renderSourceTable(items) {
    if (!items || !items.length) {
      return '<div class="card"><div class="empty-state"><i class="bi bi-inbox"></i><p>ยังไม่มีข้อมูลพจนานุกรม</p></div></div>';
    }

    var html = '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead>'
      + '<tr><th>Source</th><th>Entries</th><th>ล่าสุด</th></tr></thead><tbody>';
    items.forEach(function (item) {
      html += '<tr><td><strong>' + esc(item.source_title || '-') + '</strong></td>'
        + '<td>' + formatNum(item.entries || 0) + '</td>'
        + '<td>' + esc(TH.smart(item.updated_at || '')) + '</td></tr>';
    });
    html += '</tbody></table></div></div>';
    return html;
  }

  function renderImportWorkspace(summary, heading, standalone) {
    var html = pageHero(
      heading,
      'แกนระบบพร้อมใช้งานแล้ว เหลือเฉพาะงาน import และจัดการข้อมูลกลาง',
      'bi-box-arrow-in-down',
      [
        { val: formatNum(summary.total_entries || 0), lbl: 'ศัพท์ทั้งหมด', icon: 'bi-journal-text', color1: '#0f766e', color2: '#14b8a6' },
        { val: formatNum(summary.total_sources || 0), lbl: 'แหล่งข้อมูล', icon: 'bi-collection-fill', color1: '#1d4ed8', color2: '#60a5fa' },
        { val: formatNum(summary.latest_batch_size || 0), lbl: 'batch ล่าสุด', icon: 'bi-box-seam-fill', color1: '#b45309', color2: '#f59e0b' }
      ]
    );

    html += '<div class="toolbar">'
      + '<div class="hero-pill" style="margin:0"><i class="bi bi-shield-check"></i> auth + users + settings + audit ยังอยู่ครบ</div>'
      + (hasCap('file.manage') ? '<button type="button" class="btn btn-primary" id="' + (standalone ? 'import-open-page' : 'import-open-dashboard') + '"><i class="bi bi-upload"></i> นำเข้าพจนานุกรม</button>' : '')
      + '</div>';

    html += '<div class="card"><h3 class="card-title"><i class="bi bi-lightning-charge-fill"></i> เมนูด่วน</h3>'
      + '<div class="qa-grid">'
      + qaCard('#/import', 'bi-box-arrow-in-down', 'Import Dictionary', '#0f766e', '#14b8a6', '*')
      + qaCard('#/users', 'bi-people-fill', 'Users', '#1d4ed8', '#60a5fa', 'user.manage')
      + qaCard('#/settings', 'bi-sliders', 'Settings', '#b45309', '#f59e0b', 'setting.manage')
      + qaCard('#/audit', 'bi-clipboard-data-fill', 'Audit', '#7c3aed', '#a78bfa', 'audit.view_all')
      + '</div></div>';

    html += '<div class="card"><h3 class="card-title"><i class="bi bi-database-fill"></i> สรุป source ที่นำเข้า</h3>'
      + renderSourceTable(summary.sources || [])
      + '</div>';

    html += '<div class="card"><h3 class="card-title"><i class="bi bi-info-circle-fill"></i> โครงระบบปัจจุบัน</h3>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">'
      + statCard('เหลือไว้', 'Core UI shell, auth, users, settings, audit')
      + statCard('ตัดออก', 'students, visits, reports เชิงเยี่ยมบ้าน, teacher mappings')
      + statCard('ระบบแรก', 'Yomitan / CC-CEDICT import')
      + '</div></div>';

    return html;
  }

  function statCard(title, text) {
    return '<div style="border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff">'
      + '<div style="font-weight:700;margin-bottom:6px">' + esc(title) + '</div>'
      + '<div style="font-size:13px;color:var(--ink-muted)">' + esc(text) + '</div></div>';
  }

  function renderImportProgress(progress) {
    progress = progress || {};
    var percent = Number(progress.percent || 0);
    if (!isFinite(percent)) percent = 0;
    percent = Math.max(0, Math.min(100, percent));
    var processed = Number(progress.processed || 0);
    var total = Number(progress.total || 0);
    var inserted = Number(progress.inserted || 0);
    return '<div style="display:flex;flex-direction:column;gap:12px">'
      + '<div style="font-weight:700;font-size:14px">' + esc(progress.message || 'กำลังนำเข้าข้อมูล') + '</div>'
      + '<div style="height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden"><div id="dict-import-progress-fill" style="height:100%;width:' + percent + '%;background:linear-gradient(90deg,#0f766e,#14b8a6);transition:width .25s ease"></div></div>'
      + '<div style="display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--ink-muted)"><span id="dict-import-progress-label">' + percent + '%</span><span id="dict-import-progress-count">' + formatNum(processed) + ' / ' + formatNum(total) + '</span></div>'
      + '<div style="font-size:12px;color:var(--ink-muted)" id="dict-import-progress-meta">นำเข้าแล้ว ' + formatNum(inserted) + ' รายการ' + (progress.current_file ? ' · ' + esc(progress.current_file) : '') + '</div>'
      + '</div>';
  }

  function updateImportProgressUI(progress) {
    progress = progress || {};
    var percent = Math.max(0, Math.min(100, Number(progress.percent || 0)));
    var fill = $('#dict-import-progress-fill');
    var label = $('#dict-import-progress-label');
    var count = $('#dict-import-progress-count');
    var meta = $('#dict-import-progress-meta');
    var status = $('#dict-import-progress-status');
    if (fill) fill.style.width = percent + '%';
    if (label) label.textContent = percent + '%';
    if (count) count.textContent = formatNum(progress.processed || 0) + ' / ' + formatNum(progress.total || 0);
    if (meta) meta.textContent = 'นำเข้าแล้ว ' + formatNum(progress.inserted || 0) + ' รายการ' + (progress.current_file ? ' · ' + progress.current_file : '');
    if (status) status.textContent = progress.message || 'กำลังนำเข้าข้อมูล';
  }

  function openDictionaryImportModal() {
    if (!hasCap('file.manage')) {
      alertError('ไม่มีสิทธิ์', 'บัญชีนี้ยังไม่มีสิทธิ์ import พจนานุกรม');
      return;
    }

    var html = '<form id="dict-import-form">'
      + field('ไฟล์ Yomitan ZIP/JSON <span class="req">*</span>', '<input class="input" type="file" name="file" accept=".zip,.json,application/zip,application/json" required>')
      + field('ชื่อ source', '<input class="input" name="title" placeholder="ปล่อยว่างเพื่อใช้ชื่อจากไฟล์/index.json">', 'ใช้ override ชื่อชุดข้อมูลถ้าต้องการ')
      + field('แทนที่ source เดิม', '<label class="check"><input type="checkbox" name="replace_existing" checked> ลบข้อมูล source เดิมชื่อเดียวกันก่อน import</label>')
      + '</form>';

    Modal.open({
      title: 'นำเข้าพจนานุกรม',
      html: html,
      large: true,
      footer: '<button type="button" class="btn btn-ghost" data-modal-close>ยกเลิก</button><button type="button" class="btn btn-primary" id="dict-import-save"><i class="bi bi-upload"></i> เริ่ม import</button>',
      onOpen: function () {
        $('#dict-import-save').addEventListener('click', function (e) {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          var form = $('#dict-import-form');
          var file = form && form.file && form.file.files ? form.file.files[0] : null;
          if (!file) {
            alertError('ยังไม่มีไฟล์', 'กรุณาเลือกไฟล์ Yomitan ก่อน');
            return;
          }

          var data = formToObj(form);
          var jobId = 'job_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
          var reader = new FileReader();
          Spinner.show('กำลังอ่านไฟล์พจนานุกรม...');
          reader.onload = function () {
            Spinner.hide();
            Modal.open({
              title: 'กำลังนำเข้าพจนานุกรม',
              html: '<div id="dict-import-progress-status" style="font-weight:700;font-size:14px;margin-bottom:12px">กำลังส่งข้อมูลไป backend</div>' + renderImportProgress({
                percent: 2,
                processed: 0,
                total: 0,
                inserted: 0,
                message: 'กำลังส่งข้อมูลไป backend'
              }),
              footer: '<button type="button" class="btn btn-ghost" disabled>กรุณารอจนกว่างานจะเสร็จ</button>'
            });

            var poller = setInterval(function () {
              call('dictionary.import_progress', { job_id: jobId }, 10000).then(function (progress) {
                updateImportProgressUI(progress);
              }).catch(function () {});
            }, 1200);

            call('dictionary.import_yomitan', {
              job_id: jobId,
              name: file.name,
              data: reader.result,
              title: data.title || '',
              replace_existing: !!data.replace_existing
            }, 330000).then(function (result) {
              clearInterval(poller);
              updateImportProgressUI({
                percent: 100,
                processed: result.inserted || 0,
                total: result.inserted || 0,
                inserted: result.inserted || 0,
                current_file: '',
                message: 'นำเข้าสำเร็จ'
              });
              Spinner.hide();
              setTimeout(function () {
                Modal.close();
                alertSuccess('นำเข้าสำเร็จ', 'เพิ่มข้อมูล ' + formatNum(result.inserted || 0) + ' รายการ');
                if (location.hash === '#/import') Routes['#/import']();
                else Routes['#/dashboard']();
              }, 350);
            }).catch(function (e) {
              clearInterval(poller);
              Spinner.hide();
              alertError('นำเข้าไม่สำเร็จ', e.message);
            });
          };
          reader.onerror = function () {
            Spinner.hide();
            alertError('อ่านไฟล์ไม่สำเร็จ', 'เบราว์เซอร์ไม่สามารถอ่านไฟล์ที่เลือกได้');
          };
          reader.readAsDataURL(file);
        });
      }
    });
  }

  function wireImportButtons() {
    ['#import-open-dashboard', '#import-open-page'].forEach(function (sel) {
      var btn = $(sel);
      if (btn) {
        btn.addEventListener('click', function (e) {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
          }
          openDictionaryImportModal();
        });
      }
    });
  }

  Routes['#/dashboard'] = function () {
    var page = $('#page');
    page.innerHTML = skeletonDashboard();
    call('dictionary.summary', {}).then(function (summary) {
      if (!$('#page')) return;
      $('#page').innerHTML = renderImportWorkspace(summary, 'Core Dashboard', false);
      wireImportButtons();
    }).catch(function (e) {
      $('#page').innerHTML = '<div class="card">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + '</div>';
    });
  };

  Routes['#/import'] = function () {
    var page = $('#page');
    page.innerHTML = skeletonDashboard();
    call('dictionary.summary', {}).then(function (summary) {
      if (!$('#page')) return;
      $('#page').innerHTML = renderImportWorkspace(summary, 'Import Dictionary', true);
      wireImportButtons();
    }).catch(function (e) {
      $('#page').innerHTML = '<div class="card">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + '</div>';
    });
  };

  Routes['#/users'] = function () {
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:120px;border-radius:18px"></div>';
    call('user.list', {}).then(function (r) {
      if (!$('#page')) return;
      var html = pageHero('Users', 'จัดการผู้ใช้ของระบบกลาง', 'bi-people-fill', [
        { val: formatNum(r.total), lbl: 'ผู้ใช้ทั้งหมด', icon: 'bi-people-fill', color1: '#1d4ed8', color2: '#60a5fa' }
      ]);
      html += '<div class="toolbar"><div style="flex:1"></div>'
        + '<button class="btn btn-primary" id="usr-add"><i class="bi bi-plus-lg"></i> เพิ่มผู้ใช้</button></div>';
      html += '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead>'
        + '<tr><th>Username</th><th>ชื่อ</th><th>บทบาท</th><th>อีเมล</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>';
      r.items.forEach(function (u) {
        html += '<tr><td><strong>' + esc(u.username) + '</strong></td>'
          + '<td>' + esc(u.full_name || '') + '</td>'
          + '<td>' + roleChip(u.role) + '</td>'
          + '<td>' + esc(u.email || '-') + '</td>'
          + '<td>' + (u.is_active ? '<span class="badge b-approved">เปิดใช้งาน</span>' : '<span class="badge b-draft">ปิดใช้งาน</span>') + '</td>'
          + '<td><button class="btn btn-ghost btn-sm" data-usr-edit="' + esc(u.id) + '"><i class="bi bi-pencil"></i></button> '
          + '<button class="btn btn-ghost btn-sm" data-usr-toggle="' + esc(u.id) + '"><i class="bi bi-power"></i></button></td></tr>';
      });
      html += '</tbody></table></div></div>';
      $('#page').innerHTML = html;
      $('#usr-add').addEventListener('click', function () { openUserModal(); });
      $$('[data-usr-edit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-usr-edit');
          var u = r.items.filter(function (x) { return x.id === id; })[0];
          openUserModal(u);
        });
      });
      $$('[data-usr-toggle]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-usr-toggle');
          call('user.toggle', { id: id }).then(function () {
            toast('อัปเดตสำเร็จ', 'success');
            Routes['#/users']();
          }).catch(function (e) {
            alertError('ผิดพลาด', e.message);
          });
        });
      });
    });
  };

  function openUserModal(u) {
    u = u || { role: 'teacher', is_active: 'yes' };
    var isNew = !u.id;
    var html = '<form id="usr-form">'
      + '<div class="fg-2">'
      + field('Username <span class="req">*</span>', '<input class="input" name="username" value="' + esc(u.username || '') + '" required>')
      + field('บทบาท <span class="req">*</span>', '<select class="select" name="role">'
          + ['admin', 'director', 'academic', 'teacher'].map(function (r) {
              return '<option value="' + r + '"' + (u.role === r ? ' selected' : '') + '>' + esc(Store.boot.roles[r]) + '</option>';
            }).join('')
          + '</select>')
      + '</div>'
      + field('ชื่อ-สกุล <span class="req">*</span>', '<input class="input" name="full_name" value="' + esc(u.full_name || '') + '" required>')
      + '<div class="fg-2">'
      + field('อีเมล', '<input class="input" name="email" value="' + esc(u.email || '') + '">')
      + field('โทรศัพท์', '<input class="input" name="phone" value="' + esc(u.phone || '') + '">')
      + '</div>'
      + field('ตำแหน่ง', '<input class="input" name="position" value="' + esc(u.position || '') + '">')
      + field(isNew ? 'รหัสผ่าน <span class="req">*</span>' : 'รหัสผ่านใหม่', '<input class="input" type="password" name="password"' + (isNew ? ' required' : '') + '>')
      + '<input type="hidden" name="id" value="' + esc(u.id || '') + '">'
      + '</form>';
    Modal.open({
      title: isNew ? 'เพิ่มผู้ใช้' : 'แก้ไข ' + (u.username || ''),
      html: html,
      large: true,
      footer: '<button class="btn btn-ghost" data-modal-close>ยกเลิก</button><button class="btn btn-primary" id="usr-save"><i class="bi bi-check-lg"></i> บันทึก</button>',
      onOpen: function () {
        $('#usr-save').addEventListener('click', function () {
          var data = formToObj($('#usr-form'));
          Spinner.show('กำลังบันทึก...');
          call('user.upsert', data).then(function () {
            Spinner.hide();
            Modal.close();
            toast('บันทึกเรียบร้อย', 'success');
            Routes['#/users']();
          }).catch(function (e) {
            Spinner.hide();
            alertError('ผิดพลาด', e.message);
          });
        });
      }
    });
  }

  Routes['#/settings'] = function () {
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:120px;border-radius:18px"></div>';
    call('setting.get', {}).then(function (settings) {
      if (!$('#page')) return;
      var html = pageHero('Settings', 'ตั้งค่าระบบกลางและปลายทางจัดเก็บไฟล์', 'bi-sliders');
      html += '<div class="card"><h3 class="card-title"><i class="bi bi-gear-fill"></i> ข้อมูลระบบ</h3>'
        + '<form id="set-form">'
        + field('ชื่อองค์กร', '<input class="input" name="org_name" value="' + esc(settings.org_name || '') + '">')
        + field('คำอธิบายระบบ', '<input class="input" name="org_address" value="' + esc(settings.org_address || '') + '">')
        + '<div class="fg-2">'
        + field('อีเมล', '<input class="input" name="org_email" value="' + esc(settings.org_email || '') + '">')
        + field('โทรศัพท์', '<input class="input" name="org_phone" value="' + esc(settings.org_phone || '') + '">')
        + '</div>'
        + field('Google Drive Root Folder ID', '<input class="input" name="drive_root_id" value="' + esc(settings.drive_root_id || '') + '" placeholder="เว้นว่างเพื่อใช้โฟลเดอร์ preview อัตโนมัติ">')
        + field('แสดงบัญชี demo', '<select class="select" name="show_demo_users"><option value="yes"' + (settings.show_demo_users === 'yes' ? ' selected' : '') + '>เปิด</option><option value="no"' + (settings.show_demo_users === 'no' ? ' selected' : '') + '>ปิด</option></select>')
        + '</form>'
        + '<div style="margin-top:16px;text-align:right"><button class="btn btn-primary" id="set-save"><i class="bi bi-check-lg"></i> บันทึก</button></div>'
        + '</div>';
      $('#page').innerHTML = html;
      $('#set-save').addEventListener('click', function () {
        var data = formToObj($('#set-form'));
        Spinner.show('กำลังบันทึกการตั้งค่า...');
        call('setting.update', { values: data }).then(function () {
          Spinner.hide();
          toast('บันทึกเรียบร้อย', 'success');
          call('app.bootstrap', {}).then(function (b) { Store.boot = b; }).catch(function () {});
        }).catch(function (e) {
          Spinner.hide();
          alertError('บันทึกไม่สำเร็จ', e.message);
        });
      });
    });
  };

  Routes['#/profile'] = function () {
    var u = Store.user;
    var html = pageHero('Profile', esc(u.full_name || ''), 'bi-person-circle');
    html += '<div class="card"><h3 class="card-title"><i class="bi bi-person-fill"></i> ข้อมูลส่วนตัว</h3>'
      + '<form id="prof-form">'
      + field('ชื่อ-สกุล', '<input class="input" name="full_name" value="' + esc(u.full_name || '') + '">')
      + '<div class="fg-2">'
      + field('อีเมล', '<input class="input" name="email" value="' + esc(u.email || '') + '">')
      + field('โทรศัพท์', '<input class="input" name="phone" value="' + esc(u.phone || '') + '">')
      + '</div>'
      + field('ตำแหน่ง', '<input class="input" name="position" value="' + esc(u.position || '') + '">')
      + '</form>'
      + '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><a class="btn btn-ghost" href="#/change-password"><i class="bi bi-key"></i> เปลี่ยนรหัสผ่าน</a><button class="btn btn-primary" id="prof-save"><i class="bi bi-check-lg"></i> บันทึก</button></div>'
      + '</div>';
    $('#page').innerHTML = html;
    $('#prof-save').addEventListener('click', function () {
      var data = formToObj($('#prof-form'));
      Spinner.show('กำลังบันทึก...');
      call('profile.update', data).then(function (user) {
        Spinner.hide();
        Store.user = user;
        toast('บันทึกเรียบร้อย', 'success');
        Routes['#/profile']();
      }).catch(function (e) {
        Spinner.hide();
        alertError('ผิดพลาด', e.message);
      });
    });
  };

  Routes['#/change-password'] = function () {
    var html = pageHero('Change Password', 'อัปเดตรหัสผ่านของบัญชีนี้', 'bi-key-fill');
    html += '<div class="card" style="max-width:540px"><form id="pwd-form">'
      + field('รหัสผ่านเดิม', '<input class="input" type="password" name="current" required>')
      + field('รหัสผ่านใหม่', '<input class="input" type="password" name="next" required minlength="6">')
      + field('ยืนยันรหัสผ่านใหม่', '<input class="input" type="password" name="confirm" required minlength="6">')
      + '</form>'
      + '<div style="margin-top:16px;text-align:right"><button class="btn btn-primary" id="pwd-save"><i class="bi bi-check-lg"></i> บันทึก</button></div>'
      + '</div>';
    $('#page').innerHTML = html;
    $('#pwd-save').addEventListener('click', function () {
      var data = formToObj($('#pwd-form'));
      if (data.next !== data.confirm) {
        alertError('ข้อมูลไม่ถูกต้อง', 'รหัสผ่านใหม่ไม่ตรงกัน');
        return;
      }
      Spinner.show('กำลังเปลี่ยนรหัสผ่าน...');
      call('auth.change_password', data).then(function () {
        Spinner.hide();
        alertSuccess('สำเร็จ', 'เปลี่ยนรหัสผ่านเรียบร้อย');
        location.hash = '#/profile';
      }).catch(function (e) {
        Spinner.hide();
        alertError('ผิดพลาด', e.message);
      });
    });
  };

  Routes['#/audit'] = function () {
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:120px;border-radius:18px"></div>';
    call('report.audit', { per_page: 200 }).then(function (r) {
      if (!$('#page')) return;
      var html = pageHero('Audit Log', 'ติดตามการเปลี่ยนแปลงของระบบ', 'bi-clipboard-data-fill', [
        { val: formatNum(r.total), lbl: 'รายการทั้งหมด', icon: 'bi-clipboard-data-fill', color1: '#7c3aed', color2: '#a78bfa' }
      ]);
      html += '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead>'
        + '<tr><th>เวลา</th><th>ผู้ใช้</th><th>Action</th><th>Entity</th><th>ID</th></tr></thead><tbody>';
      r.items.forEach(function (a) {
        html += '<tr><td>' + esc(TH.smart(a.ts)) + '</td>'
          + '<td>' + esc(a.username || '-') + '</td>'
          + '<td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:11px">' + esc(a.action) + '</code></td>'
          + '<td>' + esc(a.entity || '-') + '</td>'
          + '<td><small style="color:var(--ink-muted)">' + esc(a.entity_id || '-') + '</small></td></tr>';
      });
      html += '</tbody></table></div></div>';
      $('#page').innerHTML = html;
    }).catch(function (e) {
      $('#page').innerHTML = '<div class="card">โหลด audit ไม่สำเร็จ: ' + esc(e.message) + '</div>';
    });
  };
})();
</script>
