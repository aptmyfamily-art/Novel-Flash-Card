<script type="text/x-shvr-core-pages" id="shvr-pages-script">
/* ═══════════════════════════════════════════════════════════════
   SHVR · Page Handlers — Dashboard, Students, Visits, Reports, etc.
   ═══════════════════════════════════════════════════════════════ */
(function () {
  'use strict';
  var $ = window.$ || function (s, r) { return (r||document).querySelector(s); };
  var $$ = window.$$ || function (s, r) { return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
  var esc = window.esc, call = window.call, TH = window.TH;
  var Store = window.Store, Routes = window.Routes;
  var Modal = window.Modal, Spinner = window.Spinner;
  var toast = window.toast, alertSuccess = window.alertSuccess, alertError = window.alertError;
  var confirmModal = window.confirmModal, hasCap = window.hasCap;
  var pageHero = window.pageHero, statusBadge = window.statusBadge, roleChip = window.roleChip;
  var formatNum = window.formatNum, studentName = window.studentName;

  // ════════════════════════════════════════════════════════════
  // DASHBOARD
  // ════════════════════════════════════════════════════════════
  Routes['#/dashboard'] = function () {
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:200px;border-radius:22px;margin-bottom:14px"></div>';
    Spinner.show('กำลังโหลดข้อมูล...');
    call('report.dashboard', { academic_year: Store.academic_year }).then(function (d) {
      Spinner.hide();
      if (!$('#page')) return;
      var u = Store.user;
      var greeting = greetingByTime();
      var kpis = [
        { val: formatNum(d.total_visits), lbl: 'การเยี่ยมทั้งหมด', icon: 'bi-house-heart-fill', color1: '#6366f1', color2: '#8b5cf6' },
        { val: formatNum(d.total_students), lbl: 'นักเรียนในระบบ', icon: 'bi-people-fill', color1: '#0ea5e9', color2: '#0284c7' },
        { val: formatNum(d.completed), lbl: 'บันทึกเรียบร้อย', icon: 'bi-check-circle-fill', color1: '#10b981', color2: '#059669' },
        { val: formatNum(d.draft), lbl: 'ฉบับร่าง', icon: 'bi-pencil-square', color1: '#f59e0b', color2: '#d97706' }
      ];
      var html = pageHero(greeting + ', ' + (u.full_name||''), TH.dateLongWeekday(new Date()) + ' · ' + esc(Store.boot.settings.org_name||''), 'bi-house-heart-fill', kpis);
      // Quick actions
      html += '<div class="card" style="margin-bottom:16px"><h3 class="card-title"><i class="bi bi-lightning-charge-fill" style="color:#f59e0b"></i> เมนูด่วน</h3>'
        + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">'
        + qaCard('#/visits/new', 'bi-plus-circle-fill', 'เยี่ยมบ้านใหม่', '#10b981', '#059669', 'visit.create')
        + qaCard('#/visits', 'bi-house-heart-fill', 'รายการเยี่ยมบ้าน', '#6366f1', '#8b5cf6', 'visit.view_all|visit.view_own')
        + qaCard('#/students', 'bi-people-fill', 'จัดการนักเรียน', '#0ea5e9', '#0284c7', 'student.view_all')
        + qaCard('#/reports', 'bi-bar-chart-fill', 'รายงาน', '#f59e0b', '#d97706', 'report.view_all|report.view_own')
        + qaCard('#/users', 'bi-person-badge-fill', 'ผู้ใช้ระบบ', '#f43f5e', '#e11d48', 'user.manage')
        + qaCard('#/settings', 'bi-gear-fill', 'ตั้งค่าระบบ', '#64748b', '#334155', 'setting.manage')
        + '</div></div>';
      var catOrder = ['warm_family','broken_family','distant_family','lives_with_both_parents','lives_with_single_parent','not_living_with_parents'];
      var catLabels = d.student_category_labels || {};
      var catCounts = d.student_categories || {};
      // Privacy/UI: show counts only, not student names
      var catStudents = {};
      html += '<div class="card" style="margin-bottom:16px"><h3 class="card-title"><i class="bi bi-tags-fill" style="color:#0ea5e9"></i> ความใกล้ชิดของนักเรียนกับครอบครัว</h3>'
        + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px">';
      catOrder.forEach(function (k) {
        var list = catStudents[k] || [];
        html += '<div style="border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff">'
          + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">'
          + '<div style="font-weight:700;font-size:13px;line-height:1.35">' + esc(catLabels[k] || k) + '</div>'
          + '<div style="font-size:22px;font-weight:800;color:var(--brand-1);line-height:1">' + formatNum(catCounts[k] || 0) + '</div>'
          + '</div>';
        if (!list.length) {
          html += '<div style="font-size:12px;color:var(--ink-muted)">ยังไม่มีนักเรียนในหมวดนี้</div>';
        } else {
          html += '<div style="display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto">';
          list.slice(0, 8).forEach(function (x) {
            html += '<a href="#/visits/view/' + esc(x.id) + '" style="display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:inherit;font-size:12px;padding:6px 8px;border-radius:8px;background:#f8fafc">'
              + '<span>' + esc(x.student_name || '-') + '</span>'
              + '<span style="color:var(--ink-muted);white-space:nowrap">' + esc(x.class_level || '') + (x.room ? '/' + esc(x.room) : '') + '</span>'
              + '</a>';
          });
          if (list.length > 8) html += '<div style="font-size:11px;color:var(--ink-muted);padding:2px 4px">และอีก ' + formatNum(list.length - 8) + ' ราย</div>';
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div></div>';
      var riskOrder = ['economic','safety','sexual_behavior','mental_health','physical_health','violence','substance'];
      var riskLabels = d.student_risk_labels || {};
      var riskCounts = d.student_risks || {};
      // Privacy/UI: show counts only, not student names
      var riskStudents = {};
      html += '<div class="card" style="margin-bottom:16px"><h3 class="card-title"><i class="bi bi-exclamation-triangle-fill" style="color:#f43f5e"></i> ความเสี่ยงของนักเรียน</h3>'
        + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px">';
      riskOrder.forEach(function (k) {
        var list = riskStudents[k] || [];
        html += '<div style="border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff">'
          + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px">'
          + '<div style="font-weight:700;font-size:13px;line-height:1.35">' + esc(riskLabels[k] || k) + '</div>'
          + '<div style="font-size:22px;font-weight:800;color:#e11d48;line-height:1">' + formatNum(riskCounts[k] || 0) + '</div>'
          + '</div>';
        if (!list.length) {
          html += '<div style="font-size:12px;color:var(--ink-muted)">ยังไม่มีนักเรียนในความเสี่ยงนี้</div>';
        } else {
          html += '<div style="display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto">';
          list.slice(0, 8).forEach(function (x) {
            html += '<a href="#/visits/view/' + esc(x.id) + '" style="display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:inherit;font-size:12px;padding:6px 8px;border-radius:8px;background:#fff1f2">'
              + '<span>' + esc(x.student_name || '-') + '</span>'
              + '<span style="color:var(--ink-muted);white-space:nowrap">' + esc(x.class_level || '') + (x.room ? '/' + esc(x.room) : '') + '</span>'
              + '</a>';
          });
          if (list.length > 8) html += '<div style="font-size:11px;color:var(--ink-muted);padding:2px 4px">และอีก ' + formatNum(list.length - 8) + ' ราย</div>';
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div></div>';
      // Recent
      html += '<div class="card"><h3 class="card-title"><i class="bi bi-clock-history" style="color:#6366f1"></i> รายการล่าสุด</h3>';
      if (!d.recent || !d.recent.length) {
        html += '<div class="empty-state"><i class="bi bi-inbox"></i><p>ยังไม่มีรายการเยี่ยมบ้าน</p></div>';
      } else {
        html += '<div style="overflow-x:auto"><table class="data-table"><thead><tr><th>เลขที่</th><th>นักเรียน</th><th>ชั้น</th><th>วันที่เยี่ยม</th><th>สถานะ</th><th></th></tr></thead><tbody>';
        d.recent.forEach(function (r) {
          html += '<tr><td><strong>' + esc(r.visit_code) + '</strong></td>'
            + '<td>' + esc(r.student_name||'-') + '</td>'
            + '<td>' + esc(r.class_level||'') + (r.room ? '/' + esc(r.room) : '') + '</td>'
            + '<td>' + TH.date(r.visit_date) + '</td>'
            + '<td>' + statusBadge(r.status) + '</td>'
            + '<td><a class="btn btn-ghost btn-sm" href="#/visits/view/' + esc(r.id) + '"><i class="bi bi-eye"></i> ดู</a></td></tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</div>';
      page.innerHTML = html;
    }).catch(function (e) {
      Spinner.hide();
      if ($('#page')) $('#page').innerHTML = '<div class="card"><div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + '</p></div></div>';
    });
  };
  function qaCard(hash, icon, label, c1, c2, cap) {
    if (cap && !hasCap(cap)) return '';
    return '<a href="' + hash + '" class="qa-card">'
      + '<div class="qa-card-inner">'
      + '<div class="qa-card-icon" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');box-shadow:0 8px 16px ' + c1 + '40"><i class="bi ' + icon + '"></i></div>'
      + '<div class="qa-card-label">' + esc(label) + '</div></div></a>';
  }
  function greetingByTime() {
    var h = new Date().getHours();
    if (h < 12) return 'อรุณสวัสดิ์';
    if (h < 17) return 'สวัสดี';
    return 'สวัสดียามเย็น';
  }

  // ════════════════════════════════════════════════════════════
  // STUDENTS
  // ════════════════════════════════════════════════════════════
  var STU_STATE = { q: '', class_level: '', visit_status: '', page: 1, academic_year: '' };
  // Sync STU_STATE.academic_year from Store whenever this module initialises or re-runs
  function syncStuYear() { STU_STATE.academic_year = Store.academic_year || ''; }
  Routes['#/students'] = function () {
    syncStuYear();
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:120px;border-radius:18px"></div>';
    call('student.list', STU_STATE).then(function (r) {
      if (!$('#page')) return;
      renderStudents(r);
    }).catch(function (e) {
      $('#page').innerHTML = '<div class="card">โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + '</div>';
    });
  };

  function visitStatusBadge(v) {
    if (!v) return '<span class="vs-badge vs-not"><i class="bi bi-dash-circle"></i> ยังไม่เยี่ยม</span>';
    if (v.visited_this_year) {
      var label = v.last_status === 'approved' ? 'อนุมัติแล้ว' : (v.last_status === 'completed' ? 'บันทึกแล้ว' : 'ฉบับร่าง');
      var cls = v.last_status === 'approved' ? 'vs-approved' : (v.last_status === 'completed' ? 'vs-done' : 'vs-draft');
      return '<span class="vs-badge ' + cls + '"><i class="bi bi-check-circle-fill"></i> ' + esc(label) + '</span>'
        + '<div class="vs-meta">' + TH.date(v.last_date) + (v.count_year > 1 ? ' · ' + v.count_year + ' ครั้ง/ปี' : '') + '</div>';
    }
    if (v.ever_visited) {
      return '<span class="vs-badge vs-old"><i class="bi bi-clock-history"></i> เคยเยี่ยม</span>'
        + '<div class="vs-meta">ล่าสุด ' + TH.date(v.last_date) + '</div>';
    }
    return '<span class="vs-badge vs-not"><i class="bi bi-dash-circle"></i> ยังไม่เยี่ยม</span>';
  }
  window.visitStatusBadge = visitStatusBadge;

  function renderStudents(r) {
    var st = r.stats || { total: 0, visited_this_year: 0, not_visited: 0 };
    var rate = st.total > 0 ? Math.round(st.visited_this_year / st.total * 100) : 0;
    var html = pageHero('นักเรียน', 'จัดการนักเรียน · บันทึกการเยี่ยมบ้าน ปีการศึกษา ' + (r.academic_year ? esc(r.academic_year) : '-'), 'bi-people-fill', [
      { val: formatNum(st.total), lbl: 'นักเรียนทั้งหมด', icon: 'bi-people-fill', color1: '#0ea5e9', color2: '#0284c7' },
      { val: formatNum(st.visited_this_year), lbl: 'เยี่ยมแล้ว (ปีนี้)', icon: 'bi-check-circle-fill', color1: '#10b981', color2: '#059669' },
      { val: formatNum(st.not_visited), lbl: 'ยังไม่เยี่ยม', icon: 'bi-exclamation-triangle-fill', color1: '#f59e0b', color2: '#d97706' },
      { val: rate + '%', lbl: 'อัตราเยี่ยมบ้าน', icon: 'bi-graph-up-arrow', color1: '#8b5cf6', color2: '#7c3aed' }
    ]);
    html += '<div class="toolbar">'
      + '<div class="search"><i class="bi bi-search"></i><input class="input" id="stu-q" placeholder="ค้นหาด้วยชื่อ / รหัส / เลขบัตร..." value="' + esc(STU_STATE.q) + '"></div>'
      + '<input class="input" id="stu-class" placeholder="ชั้น" value="' + esc(STU_STATE.class_level) + '" style="max-width:120px">'
      + '<select class="select" id="stu-vstatus" style="max-width:200px">'
      +   '<option value=""' + (STU_STATE.visit_status === '' ? ' selected' : '') + '>ทั้งหมด</option>'
      +   '<option value="not_visited"' + (STU_STATE.visit_status === 'not_visited' ? ' selected' : '') + '>ยังไม่เยี่ยม (ปีนี้)</option>'
      +   '<option value="visited"' + (STU_STATE.visit_status === 'visited' ? ' selected' : '') + '>เยี่ยมแล้ว (ปีนี้)</option>'
      +   '<option value="never_visited"' + (STU_STATE.visit_status === 'never_visited' ? ' selected' : '') + '>ไม่เคยเยี่ยม</option>'
      +   '<option value="ever_visited"' + (STU_STATE.visit_status === 'ever_visited' ? ' selected' : '') + '>เคยเยี่ยม</option>'
      + '</select>'
      + '<button class="btn btn-ghost" id="stu-search-btn"><i class="bi bi-funnel-fill"></i> ค้นหา</button>'
      + (hasCap('student.create') ? '<button class="btn btn-ghost" id="stu-import-btn" style="margin-left:auto"><i class="bi bi-file-earmark-spreadsheet-fill"></i> นำเข้า Excel/CSV</button>' : '')
      + (hasCap('student.create') ? '<button class="btn btn-primary" id="stu-add-btn"><i class="bi bi-plus-lg"></i> เพิ่มนักเรียน</button>' : '')
      + '</div>';

    // Filter chips for quick switch
    html += '<div class="vs-chips">'
      + chip('', 'ทั้งหมด', st.total)
      + chip('not_visited', 'ยังไม่เยี่ยม', st.not_visited, 'amber')
      + chip('visited', 'เยี่ยมแล้ว', st.visited_this_year, 'emerald')
      + '</div>';

    if (!r.items.length) {
      html += '<div class="card"><div class="empty-state"><i class="bi bi-people"></i><p>'
        + (STU_STATE.visit_status ? 'ไม่พบนักเรียนตามเงื่อนไขนี้' : 'ยังไม่มีข้อมูลนักเรียน')
        + '</p>'
        + (hasCap('student.create') && !STU_STATE.visit_status ? '<button class="btn btn-primary" id="stu-add-empty"><i class="bi bi-plus-lg"></i> เพิ่มคนแรก</button>' : '')
        + '</div></div>';
    } else {
      html += '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead>'
        + '<tr><th>รหัส</th><th>ชื่อ-นามสกุล</th><th>ชั้น/ห้อง</th><th>สถานะการเยี่ยม</th><th>เพศ</th><th>การจัดการ</th></tr>'
        + '</thead><tbody>';
      r.items.forEach(function (s) {
        var v = s._visit || {};
        html += '<tr>'
          + '<td><strong>' + esc(s.student_code||'-') + '</strong></td>'
          + '<td>' + esc(studentName(s)) + (s.nickname ? ' <span style="color:var(--ink-muted);font-size:11px">(' + esc(s.nickname) + ')</span>' : '') + '</td>'
          + '<td>' + esc(s.class_level||'') + (s.room ? '/' + esc(s.room) : '') + '</td>'
          + '<td>' + visitStatusBadge(v) + '</td>'
          + '<td>' + esc(s.gender||'') + '</td>'
          + '<td>'
          + (v.last_id ? '<a class="btn btn-ghost btn-sm" href="#/visits/view/' + esc(v.last_id) + '" title="ดูบันทึกล่าสุด"><i class="bi bi-eye"></i></a> ' : '')
          + (hasCap('visit.create') ? '<a class="btn btn-primary btn-sm" href="#/visits/new?student=' + encodeURIComponent(s.id) + '"><i class="bi bi-house-heart"></i> ' + (v.visited_this_year ? 'เยี่ยมเพิ่ม' : 'เยี่ยมบ้าน') + '</a> ' : '')
          + (hasCap('student.edit') ? '<button class="btn btn-ghost btn-sm" data-stu-edit="' + esc(s.id) + '"><i class="bi bi-pencil"></i></button> ' : '')
          + (hasCap('student.manage') ? '<button class="btn btn-ghost btn-sm" data-stu-del="' + esc(s.id) + '" style="color:#f43f5e"><i class="bi bi-trash"></i></button>' : '')
          + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
      if (r.total_pages > 1) {
        html += '<div class="pagination">';
        for (var i = 1; i <= r.total_pages; i++) {
          html += '<button data-stu-page="' + i + '" class="' + (i === r.page ? 'is-active' : '') + '">' + i + '</button>';
        }
        html += '</div>';
      }
    }
    $('#page').innerHTML = html;
    wireStudents();
  }

  function chip(value, label, count, tone) {
    var active = (STU_STATE.visit_status === value);
    return '<button class="vs-chip' + (active ? ' is-active' : '') + (tone ? ' vs-tone-' + tone : '') + '" data-stu-chip="' + esc(value) + '">'
      + esc(label) + ' <span class="vs-chip-count">' + formatNum(count) + '</span></button>';
  }

  function wireStudents() {
    var q = $('#stu-q'), cl = $('#stu-class'), vs = $('#stu-vstatus');
    var doSearch = function () {
      STU_STATE.q = q ? q.value : '';
      STU_STATE.class_level = cl ? cl.value : '';
      STU_STATE.visit_status = vs ? vs.value : '';
      STU_STATE.page = 1;
      Routes['#/students']();
    };
    if ($('#stu-search-btn')) $('#stu-search-btn').addEventListener('click', doSearch);
    if (q) q.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    if (vs) vs.addEventListener('change', doSearch);
    if ($('#stu-add-btn')) $('#stu-add-btn').addEventListener('click', function () { openStudentModal(); });
    if ($('#stu-add-empty')) $('#stu-add-empty').addEventListener('click', function () { openStudentModal(); });
    if ($('#stu-import-btn')) $('#stu-import-btn').addEventListener('click', openImportModal);
    $$('[data-stu-chip]').forEach(function (b) {
      b.addEventListener('click', function () {
        STU_STATE.visit_status = b.getAttribute('data-stu-chip');
        STU_STATE.page = 1;
        Routes['#/students']();
      });
    });
    $$('[data-stu-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openStudentModal(b.getAttribute('data-stu-edit')); });
    });
    $$('[data-stu-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-stu-del');
        confirmModal({ title: 'ลบนักเรียน?', message: 'จะปิดการใช้งานนักเรียนคนนี้ (soft delete)', danger: true, okText: 'ลบ' }).then(function (ok) {
          if (!ok) return;
          Spinner.show('กำลังลบ...', { stages: ['ตรวจสอบสิทธิ์', 'อัปเดตข้อมูล', 'เสร็จสิ้น'] });
          call('student.delete', { id: id }).then(function () { Spinner.hide(); toast('ลบเรียบร้อย', 'success'); Routes['#/students'](); })
            .catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
        });
      });
    });
    $$('[data-stu-page]').forEach(function (b) {
      b.addEventListener('click', function () { STU_STATE.page = Number(b.getAttribute('data-stu-page')); Routes['#/students'](); });
    });
  }

  function openStudentModal(id) {
    var doRender = function (s) {
      s = s || { is_active: 'yes', prefix: 'เด็กชาย', gender: 'ชาย' };
      var html = '<form id="stu-form">'
        + '<div class="fg-2">'
        + field('คำนำหน้า', '<select class="select" name="prefix">'
            + ['เด็กชาย','เด็กหญิง','นาย','นางสาว','นาง'].map(function (o) { return '<option' + (s.prefix === o ? ' selected' : '') + '>' + o + '</option>'; }).join('')
            + '</select>')
        + field('รหัสนักเรียน', '<input class="input" name="student_code" value="' + esc(s.student_code||'') + '" placeholder="auto">')
        + '</div>'
        + '<div class="fg-3">'
        + field('ชื่อ <span class="req">*</span>', '<input class="input" name="first_name" value="' + esc(s.first_name||'') + '" required>')
        + field('นามสกุล <span class="req">*</span>', '<input class="input" name="last_name" value="' + esc(s.last_name||'') + '" required>')
        + field('ชื่อเล่น', '<input class="input" name="nickname" value="' + esc(s.nickname||'') + '">')
        + '</div>'

  // ─── Bulk Import (Excel/CSV/Google Sheet) ──────────────────────────
  var __xlsxLib = null;
  function loadXLSXLib() {
    if (typeof XLSX !== 'undefined') return Promise.resolve(window.XLSX);
    if (__xlsxLib) return __xlsxLib;
    var sources = [
      'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
    ];
    __xlsxLib = new Promise(function (resolve, reject) {
      function tryLoad(idx) {
        if (typeof XLSX !== 'undefined') return resolve(window.XLSX);
        if (idx >= sources.length) {
          __xlsxLib = null;
          return reject(new Error('โหลด Excel library ไม่ได้ — ลองใช้ไฟล์ .csv แทน'));
        }
        var s = document.createElement('script');
        s.src = sources[idx]; s.async = true; s.crossOrigin = 'anonymous';
        s.onload = function () {
          if (typeof XLSX !== 'undefined') resolve(window.XLSX); else tryLoad(idx + 1);
        };
        s.onerror = function () { tryLoad(idx + 1); };
        document.head.appendChild(s);
      }
      tryLoad(0);
    });
    return __xlsxLib;
  }

  function parseCsvText(text) {
    var rows = [];
    var row = [];
    var cur = '';
    var inQuote = false;
    var i = 0, len = text.length;
    // Strip BOM
    if (text.charCodeAt(0) === 0xFEFF) i = 1;
    while (i < len) {
      var ch = text.charAt(i);
      if (inQuote) {
        if (ch === '"') {
          if (text.charAt(i+1) === '"') { cur += '"'; i++; }
          else { inQuote = false; }
        } else { cur += ch; }
      } else {
        if (ch === '"') inQuote = true;
        else if (ch === ',') { row.push(cur); cur = ''; }
        else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
        else if (ch === '\r') { /* skip */ }
        else cur += ch;
      }
      i++;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

    function handleFile(file) {

      call('student.import_sheet', { url: url }, 120000).then(function (r) {

    function readCsv(file) {
      var reader = new FileReader();
      reader.onload = function () {
        var rows = parseCsvText(String(reader.result));
        renderPreview(rows);
      };
      reader.onerror = function () { alertError('อ่านไฟล์ไม่ได้', 'ลองอีกครั้ง'); };
      reader.readAsText(file, 'UTF-8');
    }

    function readExcel(file) {
      Spinner.show('กำลังโหลด Excel library...', { stages: ['ดาวน์โหลด library','แปลงไฟล์','ตรวจสอบข้อมูล'] });
      loadXLSXLib().then(function (XLSX) {
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var wb = XLSX.read(reader.result, { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            // Clean trailing empty rows
            while (rows.length && rows[rows.length-1].every(function (c) { return String(c||'').trim() === ''; })) rows.pop();
            Spinner.hide();
            renderPreview(rows);
          } catch (e) { Spinner.hide(); alertError('อ่าน Excel ไม่ได้', e.message); }
        };
        reader.onerror = function () { Spinner.hide(); alertError('อ่านไฟล์ไม่ได้', 'ลองอีกครั้ง'); };
        reader.readAsArrayBuffer(file);
      }).catch(function (e) {
        Spinner.hide();
        alertError('โหลด Excel library ไม่ได้', e.message + '\n\nแนะนำ: บันทึกไฟล์เป็น .csv แล้วลองใหม่');

      IMPORT_STATE.default_room = String(($('#imp-default-room') && $('#imp-default-room').value) || '').trim();
      var headers = rows[0];
      var dataRows = rows.slice(1).filter(function (r) { return r.some(function (c) { return String(c||'').trim() !== ''; }); });

    function doImport(rows) {

      IMPORT_STATE.default_class_level = String(($('#imp-default-class') && $('#imp-default-class').value) || '').trim();
      IMPORT_STATE.default_room = String(($('#imp-default-room') && $('#imp-default-room').value) || '').trim();
      if (IMPORT_STATE.batches && IMPORT_STATE.batches.length) {
        importBatchQueue(IMPORT_STATE.batches.slice(), {
          total: 0, inserted: 0, duplicated: 0, failed: 0, errors: [], inserted_codes: []
        });
        return;
      }
      call('student.bulk_import', {
        rows: rows,
        source: IMPORT_STATE.filename,
        default_class_level: IMPORT_STATE.default_class_level,
        default_room: IMPORT_STATE.default_room
      }, 120000).then(function (r) {
        Spinner.hide();

    function importBatchQueue(queue, summary) {
      if (!queue.length) {
        Spinner.hide();
        Modal.close();
        showImportResult(summary);
        Routes['#/students']();
        return;
      }
      var batch = queue.shift();
      call('student.bulk_import', {
        rows: batch.rows,
        source: batch.source,
        default_class_level: batch.default_class_level || IMPORT_STATE.default_class_level,
        default_room: batch.default_room || IMPORT_STATE.default_room
      }, 120000).then(function (r) {
        summary.total += r.total || 0;
        summary.inserted += r.inserted || 0;
        summary.duplicated += r.duplicated || 0;
        summary.failed += r.failed || 0;
        summary.inserted_codes = summary.inserted_codes.concat(r.inserted_codes || []);
        summary.errors = summary.errors.concat(r.errors || []);
        importBatchQueue(queue, summary);
      }).catch(function (e) {
        Spinner.hide();
        alertError('นำเข้าไม่สำเร็จ', e.message);
      });
    }

    function showImportResult(r) {
      var errHtml = (r.errors && r.errors.length)
        ? '<div style="margin-top:12px;padding:10px;background:#fef2f2;border-left:4px solid #f43f5e;border-radius:8px;max-height:200px;overflow:auto;text-align:left;font-size:12px"><strong>ข้อผิดพลาด:</strong><ul style="margin:6px 0 0;padding-left:20px">'

  function initWizard(loaded, hash) {
    var preStudentId = '';
    if (hash && hash.indexOf('?student=') >= 0) {
      preStudentId = decodeURIComponent(hash.split('?student=')[1]);
    }
    var isNew = !loaded;
    WIZ = {
      step: 1, maxStep: isNew ? 1 : VISIT_STEPS.length,
      isNew: isNew,
      visit: loaded ? loaded.visit : { student_id: preStudentId, visit_date: TH.iso(new Date()), school_name: Store.boot.settings.org_name || '', education_area: Store.boot.settings.education_area || '', has_guardian: 'yes' },
      members: loaded ? loaded.members : [emptyMember(1)],
      student: loaded ? loaded.student : null,
      mapping: loaded ? loaded.homeroom_teachers : null,
      photos: {}
    };
    if (!WIZ.members || !WIZ.members.length) WIZ.members = [emptyMember(1)];
    renderWizard();
  }
  function emptyMember(seq) {
    return { seq: seq, relation: '', age: '', disability: '', income_wage: '', income_agri: '', income_business: '', income_welfare: '', income_other: '', total: 0 };
  }

  function renderWizard() {
    if (!$('#page')) return;
    var step = WIZ.step;
    var pct = ((step - 1) / (VISIT_STEPS.length - 1)) * 100;
    var html = pageHero(WIZ.isNew ? 'บันทึกการเยี่ยมบ้านใหม่' : 'แก้ไขการเยี่ยมบ้าน', 'กรอกข้อมูลตามแบบฟอร์มราชการ', 'bi-house-heart-fill');
    html += '<div class="wiz-progress" style="--pct:' + pct + '%">'
      + VISIT_STEPS.map(function (s) {
          var canJump = !WIZ.isNew || s.id <= WIZ.maxStep;
          var cls = s.id < step ? 'is-done' : s.id === step ? 'is-active' : '';
          cls += canJump ? ' is-jumpable' : ' is-locked';
          return '<div class="wiz-step ' + cls + '" data-wiz-jump="' + s.id + '">'
            + '<div class="wiz-step-circle"><i class="bi ' + (s.id < step ? 'bi-check-lg' : s.icon) + '"></i></div>'
            + '<div class="wiz-step-label">' + esc(s.title) + '</div></div>';
        }).join('') + '</div>';

    html += '<div class="wiz-pane" id="wiz-pane">';
    if (step === 1) html += renderStep1();
    else if (step === 2) html += renderStep2();
    else if (step === 3) html += renderStep3();
    else if (step === 4) html += renderStep4();
    else if (step === 5) html += renderStep5();
    html += '</div>';

    html += '<div class="wiz-nav">'
      + '<button class="btn btn-ghost" id="wiz-prev"' + (step === 1 ? ' disabled' : '') + '><i class="bi bi-chevron-left"></i> ย้อนกลับ</button>'
      + '<div class="wiz-pill">ขั้นที่ ' + step + ' จาก ' + VISIT_STEPS.length + '</div>'
      + (step < VISIT_STEPS.length
          ? '<button class="btn btn-primary" id="wiz-next">ถัดไป <i class="bi bi-chevron-right"></i></button>'
          : '<button class="btn btn-success" id="wiz-save"><i class="bi bi-check-circle-fill"></i> บันทึก</button>')
      + '</div>';

    $('#page').innerHTML = html;
    wireWizard();
  }

  function wireWizard() {
    $$('[data-wiz-jump]').forEach(function (el) {
      el.addEventListener('click', function () {
        var to = Number(el.getAttribute('data-wiz-jump'));
        var canJump = !WIZ.isNew || to <= WIZ.maxStep;
        if (!canJump || to === WIZ.step) return;
        captureStep();
        WIZ.step = to;
        renderWizard();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    if ($('#wiz-prev')) $('#wiz-prev').addEventListener('click', function () {
      captureStep(); WIZ.step--; renderWizard(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    if ($('#wiz-next')) $('#wiz-next').addEventListener('click', function () {
      captureStep();
      WIZ.step++;
      if (WIZ.step > WIZ.maxStep) WIZ.maxStep = WIZ.step;
      renderWizard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    if ($('#wiz-save')) $('#wiz-save').addEventListener('click', function () { captureStep(); saveVisit(); });
    // Inline wiring per step
    if (WIZ.step === 1) wireStep1();
    if (WIZ.step === 2) wireStep2();
    if (WIZ.step === 3) wireStep3();
    if (WIZ.step === 4) wireStep4();
    if (WIZ.step === 5) wireStep5();
  }

  function openStudentPicker() {
    Spinner.show('กำลังโหลด...');
    call('student.list', { per_page: 500 }).then(function (r) {
      Spinner.hide();
      var st = r.stats || { total: 0, visited_this_year: 0, not_visited: 0 };

      // ── Extract unique class levels + rooms (สำหรับ filter) ──
      var classMap = {};
      var roomMap = {};
      r.items.forEach(function (s) {
        var c = String(s.class_level || '').trim();
        var rm = String(s.room || '').trim();
        if (c) {
          classMap[c] = (classMap[c] || 0) + 1;
          var combo = c + (rm ? '/' + rm : '');
          if (combo) roomMap[combo] = (roomMap[combo] || 0) + 1;
        }
      });
      var classList = Object.keys(classMap).sort(function (a, b) {
        // Natural sort for ม.1, ม.2, ป.6 etc.
        return a.localeCompare(b, 'th', { numeric: true });
      });
      var roomList = Object.keys(roomMap).sort(function (a, b) {
        return a.localeCompare(b, 'th', { numeric: true });
      });

      // Sort items by class_level + room + name
      var sorted = r.items.slice().sort(function (a, b) {
        var ca = String(a.class_level||''), cb = String(b.class_level||'');
        if (ca !== cb) return ca.localeCompare(cb, 'th', { numeric: true });
        var ra = String(a.room||''), rb = String(b.room||'');
        if (ra !== rb) return ra.localeCompare(rb, 'th', { numeric: true });
        var na = String(a.first_name||''), nb = String(b.first_name||'');
        return na.localeCompare(nb, 'th');
      });

      var html = '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">'

        +   '<option value="">ทุกชั้น</option>'
        +   classList.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + ' (' + classMap[c] + ')</option>'; }).join('')
        + '</select>'
        + '<select class="select" id="sp-room" style="max-width:140px"><option value="">ทุกห้อง</option></select>'
        + '<select class="select" id="sp-filter" style="max-width:180px">'

      Modal.open({
        title: 'เลือกนักเรียน · ' + (r.academic_year ? 'ปีการศึกษา ' + r.academic_year : ''),
        html: html, large: true,
        onOpen: function () {
          var qEl = $('#sp-q'), cEl = $('#sp-class'), rmEl = $('#sp-room'), fEl = $('#sp-filter');

          function rebuildRoomOptions() {
            var selectedClass = cEl.value;
            var rooms = {};
            sorted.forEach(function (s) {
              if (selectedClass && String(s.class_level) !== selectedClass) return;
              var rm = String(s.room || '').trim();
              if (rm) rooms[rm] = (rooms[rm] || 0) + 1;
            });
            var roomKeys = Object.keys(rooms).sort(function (a, b) { return a.localeCompare(b, 'th', { numeric: true }); });
            var prev = rmEl.value;
            rmEl.innerHTML = '<option value="">ทุกห้อง</option>'
              + roomKeys.map(function (rm) { return '<option value="' + esc(rm) + '">ห้อง ' + esc(rm) + ' (' + rooms[rm] + ')</option>'; }).join('');
            if (prev && roomKeys.indexOf(prev) >= 0) rmEl.value = prev;
          }

          function applyFilter() {
            var q = qEl.value.toLowerCase().trim();
            var c = cEl.value;
            var rm = rmEl.value;
            var f = fEl.value;
            var visibleCount = 0, visitedShown = 0, notVisitedShown = 0;
            $$('.sp-item').forEach(function (el) {
              var matchQ = !q || el.textContent.toLowerCase().indexOf(q) >= 0;
              var matchC = !c || el.getAttribute('data-class') === c;
              var matchR = !rm || el.getAttribute('data-room') === rm;
              var visited = el.getAttribute('data-visited') === '1';
              var matchF = !f || (f === 'visited' && visited) || (f === 'not_visited' && !visited);
              var show = matchQ && matchC && matchR && matchF;
              el.style.display = show ? '' : 'none';
              if (show) {
                visibleCount++;
                if (visited) visitedShown++; else notVisitedShown++;
              }
            });
            // Update stats bar
            var sv = $('#sp-stat-visited'); if (sv) sv.innerHTML = '<strong>' + formatNum(visitedShown) + '</strong> เยี่ยมแล้ว';
            var sn = $('#sp-stat-notvisited'); if (sn) sn.innerHTML = '<strong>' + formatNum(notVisitedShown) + '</strong> ยังไม่เยี่ยม';
            var sa = $('#sp-stat-total'); if (sa) sa.innerHTML = '<strong>' + formatNum(visibleCount) + '</strong> รวม';
            // Empty state
            var emptyEl = $('#sp-empty');
            if (emptyEl) emptyEl.hidden = visibleCount > 0;
          }

          if (qEl) qEl.addEventListener('input', applyFilter);
          if (cEl) cEl.addEventListener('change', function () { rebuildRoomOptions(); applyFilter(); });
          if (rmEl) rmEl.addEventListener('change', applyFilter);
          if (fEl) fEl.addEventListener('change', applyFilter);

          rebuildRoomOptions();
          setTimeout(function () { if (qEl) try { qEl.focus(); } catch (e) {} }, 100);

          $$('.sp-item').forEach(function (el) {
            el.addEventListener('click', function () {
              var id = el.getAttribute('data-id');
              var s = sorted.filter(function (x) { return x.id === id; })[0];
              pickStudent(s);
            });
          });
        }
      });
    }).catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
  }
  function pickStudent(s) {
    if (!s) return;
    var dateField = document.querySelector('[data-field="visit_date"]');
    var visitDate = dateField ? dateField.value : (WIZ.visit.visit_date || TH.iso(new Date()));

    call('visit.check_duplicate', { student_id: s.id, visit_date: visitDate }).then(function (r) {
      Spinner.hide();
      if (r && r.duplicate) {
        showDuplicateWarning(s, r.duplicate);
      } else {

    }).catch(function (e) {
      Spinner.hide();

  function wireStep2() {
    var body = $('#income-body');
    function recalc() {
      var total = 0;
      $$('tr[data-row]', body).forEach(function (tr) {
        var sum = 0;
        ['income_wage','income_agri','income_business','income_welfare','income_other'].forEach(function (f) {
          var el = tr.querySelector('[data-mf="' + f + '"]');
          sum += Number(el.value) || 0;
        });
        tr.querySelector('[data-total]').textContent = formatNum(sum);
        total += sum;
      });
      $('#income-total').textContent = formatNum(total);
      var count = Number(document.querySelector('[data-field="household_count"]').value) || $$('tr[data-row]', body).length;
      $('#income-avg').textContent = count > 0 ? formatNum(Math.round(total / count * 100) / 100) : 0;
    }
    body.addEventListener('input', recalc);
    document.querySelector('[data-field="household_count"]').addEventListener('input', recalc);
    body.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-remove-row]');
      if (btn) {
        if ($$('tr[data-row]', body).length <= 1) return;
        btn.closest('tr').remove();
        // Renumber
        $$('tr[data-row]', body).forEach(function (tr, idx) {
          tr.setAttribute('data-row', idx);
          tr.querySelector('td:first-child').textContent = idx + 1;
        });
        recalc();
      }
    });
    $('#add-member').addEventListener('click', function () {
      var idx = $$('tr[data-row]', body).length;
      body.insertAdjacentHTML('beforeend', memberRow(emptyMember(idx + 1), idx));
      recalc();
    });
    recalc();
  }

  function wireSignaturePads() {
    $$('.sig-pad').forEach(function (pad) {
      if (pad.__sigWired) return;
      pad.__sigWired = true;
      var name = pad.getAttribute('data-sig-name');
      var canvas = pad.querySelector('.sig-canvas');
      var stage = pad.querySelector('.sig-stage');
      var placeholder = pad.querySelector('.sig-placeholder');
      var preview = pad.querySelector('.sig-preview');
      var btnClear = pad.querySelector('[data-sig-clear]');
      var btnSave = pad.querySelector('[data-sig-save]');
      var btnRedo = pad.querySelector('[data-sig-redo]');
      var fileInput = pad.querySelector('[data-sig-file]');
      if (!canvas) return;

      var ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 2.4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      var isDrawing = false, lastX = 0, lastY = 0, hasStrokes = false;

      function getPos(e) {
        var rect = canvas.getBoundingClientRect();
        var sx = canvas.width / rect.width;
        var sy = canvas.height / rect.height;
        var cx = e.touches ? e.touches[0].clientX : e.clientX;
        var cy = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (cx - rect.left) * sx, y: (cy - rect.top) * sy };
      }
      function start(e) {
        if (preview && !preview.hidden) return;
        e.preventDefault();
        isDrawing = true; hasStrokes = true;
        if (placeholder) placeholder.style.opacity = '0';
        var p = getPos(e); lastX = p.x; lastY = p.y;
      }
      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        var p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        lastX = p.x; lastY = p.y;
      }
      function stop() { isDrawing = false; }

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('mouseleave', stop);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', draw, { passive: false });
      canvas.addEventListener('touchend', stop);

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasStrokes = false;
        if (placeholder) placeholder.style.opacity = '';
      }
      function showPreview(url) {
        preview.innerHTML = '<img src="' + esc(url) + '" alt="ลายเซ็น">';
        preview.hidden = false;
        if (placeholder) placeholder.style.display = 'none';
        if (btnSave) btnSave.hidden = true;
        if (btnRedo) btnRedo.hidden = false;
        stage.classList.add('has-sig');
        WIZ.visit[name] = url;
      }
      function showCanvas() {
        preview.hidden = true;
        preview.innerHTML = '';
        if (placeholder) placeholder.style.display = '';
        clearCanvas();
        if (btnSave) btnSave.hidden = false;
        if (btnRedo) btnRedo.hidden = true;
        stage.classList.remove('has-sig');
        WIZ.visit[name] = '';
      }

      if (btnClear) btnClear.addEventListener('click', clearCanvas);
      if (btnRedo) btnRedo.addEventListener('click', showCanvas);
      if (btnSave) btnSave.addEventListener('click', function () {
        if (!hasStrokes) {
          alertWarning('ยังไม่มีลายเซ็น', 'กรุณาเซ็นในกรอบก่อน หรือเลือก "อัปโหลดไฟล์"');
          return;
        }
        var dataUrl = canvas.toDataURL('image/png');
        Spinner.show('กำลังบันทึกลายเซ็น...', { stages: ['แปลงเป็นรูปภาพ','อัปโหลด Drive','บันทึก URL'] });
        call('file.upload', { name: 'signature_' + name + '_' + Date.now() + '.png', data: dataUrl, subfolder: 'signatures' }, 60000)
          .then(function (r) { Spinner.hide(); showPreview(r.url); toast('บันทึกลายเซ็นเรียบร้อย', 'success', 1500); })
          .catch(function (e) { Spinner.hide(); alertError('อัปโหลดไม่สำเร็จ', e.message); });
      });
      if (fileInput) fileInput.addEventListener('change', function () {
        var file = fileInput.files[0]; if (!file) return;
        Spinner.show('กำลังอัปโหลด...', { stages: ['อ่านไฟล์','อัปโหลด','บันทึก'] });
        window.uploadFile(file, 'signatures').then(function (r) {
          Spinner.hide(); showPreview(r.url); toast('อัปโหลดเรียบร้อย', 'success', 1500);
        }).catch(function (e) { Spinner.hide(); alertError('อัปโหลดไม่สำเร็จ', e.message); });
      });
    });
  }

  // ─── Capture step data ────────────────────────────────────
  function captureStep() {
    $$('[data-field]').forEach(function (el) {
      var name = el.getAttribute('data-field');
      var val;
      if (el.type === 'checkbox') val = el.checked;
      else if (el.type === 'radio') { if (el.checked) WIZ.visit[name] = el.value; return; }
      else val = el.value;
      WIZ.visit[name] = val;
    });
    // Capture radio groups by name
    $$('input[type="radio"]').forEach(function (el) {
      if (el.checked && !el.hasAttribute('data-field') && el.name && !/^famrel_/.test(el.name)) {
        WIZ.visit[el.name] = el.value;
      }
    });
    // Family relations matrix
    var famRel = {};
    ['father','mother','brother','sister','grandparent','relative','other'].forEach(function (k) {
      var r = document.querySelector('input[name="famrel_' + k + '"]:checked');
      if (r) famRel[k] = r.value;
    });
    if (Object.keys(famRel).length) WIZ.visit.family_relations = famRel;
    // Capture checkbox groups
    var checkboxGroups = {};
    $$('[data-checkgroup]').forEach(function (el) {
      var g = el.getAttribute('data-checkgroup');
      if (!checkboxGroups[g]) checkboxGroups[g] = [];
      if (el.checked) checkboxGroups[g].push(el.value);
    });
    Object.keys(checkboxGroups).forEach(function (g) { WIZ.visit[g] = checkboxGroups[g]; });
    // Special: farmer_land_arr → keep first as primary value
    if (WIZ.visit.farmer_land_arr) {
      WIZ.visit.farmer_land = (WIZ.visit.farmer_land_arr[0] || '');
      delete WIZ.visit.farmer_land_arr;
    }
    // Members
    if (WIZ.step === 2) {
      var members = [];
      $$('#income-body tr[data-row]').forEach(function (tr, idx) {
        var m = { seq: idx + 1 };
        $$('[data-mf]', tr).forEach(function (inp) { m[inp.getAttribute('data-mf')] = inp.value; });
        members.push(m);
      });
      WIZ.members = members;
    }
  }

  function saveVisit() {
    if (!WIZ.visit.student_id) { alertError('ข้อมูลไม่ครบ', 'กรุณาเลือกนักเรียน'); WIZ.step = 1; renderWizard(); return; }

    WIZ.saving = true;
    Spinner.show('กำลังบันทึก...', { stages: ['ตรวจสอบข้อมูล','ตรวจสอบบันทึกซ้ำ','บันทึกข้อมูลหลัก','บันทึกสมาชิกครัวเรือน','เสร็จสิ้น'] });
    var payload = { visit: WIZ.visit, members: WIZ.members };
    if (WIZ.forceCreate) payload.force = true;
    call('visit.save', payload, 60000).then(function (d) {
      Spinner.hide();
      WIZ.saving = false;
      var visitId = d.visit.id;

        timer: 1500,
        showConfirmButton: false,
        allowOutsideClick: false
      }).then(function () {
        location.hash = '#/visits/print/' + visitId;
      });
    })
.catch(function (e) {
      Spinner.hide();

      // Handle duplicate error specifically
      if (e.message && e.message.indexOf('DUPLICATE:') === 0) {
        var msg = e.message.substring(10);
        Swal.fire({
          icon: 'warning',

          showCancelButton: true,
          confirmButtonText: 'กลับไปรายการ',
          cancelButtonText: 'แก้ไขฟอร์มต่อ',
          reverseButtons: true
        }).then(function (r) {
          if (r.isConfirmed) location.hash = '#/visits';
        });
        return;
      }
      alertError('บันทึกไม่สำเร็จ', e.message);
    });
  }

  function savePrintPdfToDrive(d, id) {
    var fileName = 'รายงานการเยี่ยมบ้าน_' + studentName(d.student) + '_' + (d.visit.visit_code || Date.now()) + '.pdf';
    Spinner.show('กำลังสร้างไฟล์ PDF คุณภาพสูง...', { stages: ['เรนเดอร์เอกสาร', 'โหลดฟอนต์และรูปภาพ', 'บันทึกลง Drive'] });

    var root = document.documentElement;

    function cleanupCaptureMode() {
      root.classList.remove('pdf-capture-mode');
      element.classList.remove('is-capturing');
    }

    Promise.all([
      (document.fonts ? document.fonts.ready : Promise.resolve()),
      new Promise(function(resolve) { setTimeout(resolve, 2500); })
    ]).then(function () {
      root.classList.add('pdf-capture-mode');
      element.classList.add('is-capturing');

      var opt = {
        margin: 0,
        filename: fileName,
        image: { type: 'jpeg', quality: 1.0 },
        html2canvas: {
          scale: 2,
          useCORS: true,
          letterRendering: true,
          scrollX: 0,
          scrollY: 0
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css'] }
      };

      return html2pdf().set(opt).from(element).outputPdf('datauristring').then(function (pdfBase64) {
        call('file.upload', {
          name: fileName,
          data: pdfBase64,
          subfolder: d.visit.academic_year || 'PDF_Reports',
          overwrite: true
        }).then(function () {
          cleanupCaptureMode();
          Spinner.hide();
          Swal.fire({
            icon: 'success',
            title: 'บันทึก PDF เรียบร้อย',
            text: 'ระบบสร้างไฟล์ PDF คุณภาพสูงและบันทึกลง Drive แล้ว',
            timer: 2000,
            showConfirmButton: false

          cleanupCaptureMode();
          Spinner.hide();
          alertError('บันทึก PDF ไม่สำเร็จ', err.message);
        });
      });
    }).catch(function (err) {
      cleanupCaptureMode();
      Spinner.hide();
      alertError('บันทึก PDF ไม่สำเร็จ', err.message);
    });

  function wireVisitsBatchActions(items) {
    var idsOnPage = (items || [])
      .map(function (v) { return String(v.id || ''); })
      .filter(function (id) { return !!id; });
    var batchBtn = $('#vis-drive-batch');
    var allBox = $('#vis-batch-all');

    function selectedCount() { return Object.keys(VIS_BATCH_SELECTED).length; }

    function syncBatchUi() {
      var count = selectedCount();
      var countEl = $('#vis-batch-count');
      if (countEl) countEl.textContent = String(count);
      if (batchBtn) batchBtn.disabled = count === 0;
      if (!allBox) return;

      var selectedOnPage = 0;
      idsOnPage.forEach(function (id) { if (VIS_BATCH_SELECTED[id]) selectedOnPage++; });
      allBox.checked = idsOnPage.length > 0 && selectedOnPage === idsOnPage.length;
      allBox.indeterminate = selectedOnPage > 0 && selectedOnPage < idsOnPage.length;
    }

    $$('[data-vis-batch-id]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-vis-batch-id');
        if (cb.checked) VIS_BATCH_SELECTED[id] = true;
        else delete VIS_BATCH_SELECTED[id];
        syncBatchUi();
      });
    });

    if (allBox) {
      allBox.addEventListener('change', function () {
        idsOnPage.forEach(function (id) {
          if (allBox.checked) VIS_BATCH_SELECTED[id] = true;
          else delete VIS_BATCH_SELECTED[id];
        });
        $$('[data-vis-batch-id]').forEach(function (cb) { cb.checked = allBox.checked; });
        syncBatchUi();
      });
    }

    if (batchBtn) {
      batchBtn.addEventListener('click', function () {
        var ids = Object.keys(VIS_BATCH_SELECTED);
        if (!ids.length) {
          alertError('ยังไม่ได้เลือกรายการ', 'กรุณาเลือกอย่างน้อย 1 รายการเพื่อบันทึกลง Drive');
          return;
        }
        confirmModal({
          title: 'บันทึกลง Drive แบบ Batch?',
          message: 'ต้องการสร้าง PDF และบันทึกลง Drive จำนวน ' + formatNum(ids.length) + ' รายการ',
          danger: false
        }).then(function (ok) {
          if (!ok) return;
          saveVisitsToDriveBatch(ids).then(function (result) {
            if (result.failed.length) {
              var detail = result.failed.slice(0, 6).map(function (f) {
                return '- ' + f.id + ' - ' + f.error;
                /*
                return '• ' + f.id + ' - ' + f.error;
                */
              }).join('\n');
              alertError('บันทึกบางรายการไม่สำเร็จ', 'สำเร็จ ' + formatNum(result.success) + ' / ' + formatNum(result.total) + '\n\n' + detail);
            } else {
              alertSuccess('สำเร็จ', 'บันทึกลง Drive สำเร็จ ' + formatNum(result.success) + ' รายการ');
            }
            VIS_BATCH_SELECTED = {};
            Routes['#/visits']();
          });
        });
      });
    }

    syncBatchUi();
  }

  function saveVisitsToDriveBatch(ids) {
    var list = (ids || []).map(function (id) { return String(id || ''); }).filter(function (id) { return !!id; });
    var result = { total: list.length, success: 0, failed: [] };
    if (!list.length) return Promise.resolve(result);

    var chain = Promise.resolve();
    list.forEach(function (id, index) {
      chain = chain.then(function () {
        Spinner.show('กำลังบันทึกลง Drive แบบ Batch (' + (index + 1) + '/' + list.length + ')...');
        return saveVisitPdfByIdToDrive(id).then(function () {
          result.success++;
        }).catch(function (err) {
          result.failed.push({
            id: id,
            error: (err && err.message) ? err.message : String(err || 'Unknown error')
          });
        });
      });
    });

    return chain.then(function () {
      Spinner.hide();
      return result;
    }).catch(function (err) {
      Spinner.hide();
      result.failed.push({ id: '-', error: (err && err.message) ? err.message : String(err || 'Unknown error') });
      return result;
    });
  }

  function saveVisitPdfByIdToDrive(id) {
    return call('visit.print', { id: id }).then(function (d) {
      return saveVisitPdfFromDataToDrive(d, { overwrite: true });
    });
  }

  function saveVisitPdfFromDataToDrive(d, opts) {
    opts = opts || {};
    if (typeof window.buildPrintForm !== 'function') {
      return Promise.reject(new Error('โหลด print template ไม่ได้'));
    }

    var fileName = 'รายงานการเยี่ยมบ้าน_' + studentName(d.student) + '_' + (d.visit.visit_code || Date.now()) + '.pdf';
    var host = document.createElement('div');
    host.style.position = 'fixed';
    host.style.left = '-10000px';
    host.style.top = '0';
    host.style.width = '210mm';
    host.style.background = '#fff';
    host.style.pointerEvents = 'none';
    host.style.zIndex = '9999';
    host.innerHTML = window.buildPrintForm(d);

    var element = host.querySelector('.print-doc');
    if (!element) return Promise.reject(new Error('ไม่พบเอกสารสำหรับสร้าง PDF'));
    var tb = element.querySelector('.print-toolbar');
    if (tb && tb.parentNode) tb.parentNode.removeChild(tb);
    element.classList.add('is-capturing');
    document.body.appendChild(host);

    var opt = {
      margin: 0,
      filename: fileName,
      image: { type: 'jpeg', quality: 1.0 },
      html2canvas: { scale: 2, useCORS: true, letterRendering: true, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css'] }
    };

    function cleanup() {
      if (host && host.parentNode) host.parentNode.removeChild(host);
    }

    return Promise.all([
      (document.fonts ? document.fonts.ready : Promise.resolve()),
      new Promise(function (resolve) { setTimeout(resolve, 2500); })
    ]).then(function () {
      return html2pdf().set(opt).from(element).outputPdf('datauristring');
    }).then(function (pdfBase64) {
      cleanup();
      return call('file.upload', {
        name: fileName,
        data: pdfBase64,
        subfolder: d.visit.academic_year || 'PDF_Reports',
        overwrite: opts.overwrite !== false
      });
    }).catch(function (err) {
      cleanup();
      throw err;
    });
  }

  function renderPrintForm(d) {
    if (typeof window.buildPrintForm === 'function') {

  }

      var f = $('#prof-form');
      var data = formToObj(f);
      var fileEl = f.querySelector('input[name="photo"]');
      var file = fileEl && fileEl.files[0];
      var doSave = function () {
        delete data.photo;
        Spinner.show('กำลังบันทึก...');
        call('profile.update', data).then(function (u) {
          Spinner.hide(); Store.user = u; toast('บันทึกเรียบร้อย','success');
          Routes['#/profile']();
        }).catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
      };
      if (file) {
        Spinner.show('กำลังอัปโหลด...');
        window.uploadFile(file, 'users').then(function (r) { data.photo_url = r.url; Spinner.hide(); doSave(); })
          .catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
      } else doSave();
    });
  };

  Routes['#/change-password'] = function () {
    var html = pageHero('เปลี่ยนรหัสผ่าน', 'อัปเดตรหัสผ่านของคุณ', 'bi-key-fill');
    html += '<div class="card" style="max-width:540px"><form id="pwd-form">'
      + field('รหัสผ่านเดิม', '<input class="input" type="password" name="current" required>')
      + field('รหัสผ่านใหม่', '<input class="input" type="password" name="next" required minlength="6">')
      + field('ยืนยันรหัสผ่านใหม่', '<input class="input" type="password" name="confirm" required minlength="6">')
      + '</form>'
      + '<div style="margin-top:16px;text-align:right"><button class="btn btn-primary" id="pwd-save"><i class="bi bi-check-lg"></i> เปลี่ยนรหัสผ่าน</button></div>'
      + '</div>';
    $('#page').innerHTML = html;
    $('#pwd-save').addEventListener('click', function () {
      var data = formToObj($('#pwd-form'));
      if (data.next !== data.confirm) { alertError('ผิดพลาด','รหัสผ่านใหม่ไม่ตรงกัน'); return; }
      Spinner.show('กำลังเปลี่ยน...');
      call('auth.change_password', data).then(function () {
        Spinner.hide(); alertSuccess('สำเร็จ','รหัสผ่านเปลี่ยนเรียบร้อย'); location.hash = '#/profile';
      }).catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
    });
  };

  // ════════════════════════════════════════════════════════════
  // REPORTS + AUDIT
  // ════════════════════════════════════════════════════════════
  Routes['#/reports'] = function () {
    Routes['#/dashboard']();
  };

  Routes['#/audit'] = function () {
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:120px;border-radius:18px"></div>';
    call('report.audit', { per_page: 200 }).then(function (r) {
      if (!$('#page')) return;
      var html = pageHero('Audit Log', 'บันทึกประวัติการใช้งานระบบ', 'bi-clipboard-data-fill', [
        { val: formatNum(r.total), lbl: 'รายการทั้งหมด', icon: 'bi-clipboard-data-fill', color1: '#6366f1', color2: '#8b5cf6' }
      ]);
      html += '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead>'
        + '<tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>Entity</th><th>ID</th></tr></thead><tbody>';
      r.items.forEach(function (a) {
        html += '<tr><td>' + TH.smart(a.ts) + '</td>'
          + '<td>' + esc(a.username||'-') + '</td>'
          + '<td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:11px">' + esc(a.action) + '</code></td>'
          + '<td>' + esc(a.entity||'-') + '</td>'
          + '<td><small style="color:var(--ink-muted)">' + esc(a.entity_id||'-') + '</small></td></tr>';
      });
      html += '</tbody></table></div></div>';
      $('#page').innerHTML = html;
    });
  };

  // ════════════════════════════════════════════════════════════
  // HOMEROOM TEACHER MAPPINGS
  // ════════════════════════════════════════════════════════════
  Routes['#/settings/teachers'] = function () {
    var page = $('#page');
    page.innerHTML = '<div class="sk sk-block" style="height:120px;border-radius:18px"></div>';
    call('mapping.list', { academic_year: Store.academic_year }).then(function (r) {
      if (!$('#page')) return;
      var html = pageHero('ครูประจำชั้น', 'กำหนดครูประจำชั้นสำหรับแต่ละห้องเรียน ปีการศึกษา ' + (Store.academic_year || '-'), 'bi-person-badge-fill', [
        { val: formatNum(r.total), lbl: 'ห้องเรียนที่กำหนดแล้ว', icon: 'bi-building-fill-check', color1: '#6366f1', color2: '#8b5cf6' }
      ]);
      html += '<div class="toolbar">'
        + '<div style="flex:1"></div>'
        + '<button class="btn btn-primary" id="map-add"><i class="bi bi-plus-lg"></i> เพิ่มการกำหนดห้อง</button></div>';

      if (!r.items.length) {
        html += '<div class="card"><div class="empty-state"><i class="bi bi-person-badge"></i><p>ยังไม่มีการกำหนดครูประจำชั้นในปีการศึกษานี้</p></div></div>';
      } else {
        html += '<div class="card" style="padding:0;overflow:hidden"><div style="overflow-x:auto"><table class="data-table"><thead>'
          + '<tr><th>ชั้น/ห้อง</th><th>ครูประจำชั้นคนที่ 1</th><th>ครูประจำชั้นคนที่ 2</th><th>แก้ไขล่าสุด</th><th>จัดการ</th></tr></thead><tbody>';
        r.items.forEach(function (m) {
          html += '<tr>'
            + '<td><strong>' + esc(m.class_level) + '/' + esc(m.room) + '</strong></td>'
            + '<td>' + esc(m.teacher1_name || '-') + '</td>'
            + '<td>' + esc(m.teacher2_name || '-') + '</td>'
            + '<td><small style="color:var(--ink-muted)">' + TH.smart(m.updated_at) + '</small></td>'
            + '<td><button class="btn btn-ghost btn-sm" data-map-edit="' + esc(m.id) + '"><i class="bi bi-pencil"></i></button> '
            + '<button class="btn btn-ghost btn-sm" data-map-del="' + esc(m.id) + '" style="color:#f43f5e"><i class="bi bi-trash"></i></button></td></tr>';
        });
        html += '</tbody></table></div></div>';
      }
      $('#page').innerHTML = html;
      wireMappings(r.items);
    });
  };

  function wireMappings(items) {
    if ($('#map-add')) $('#map-add').addEventListener('click', function () { openMappingModal(); });
    $$('[data-map-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-map-edit');
        var m = items.filter(function (x) { return x.id === id; })[0];
        openMappingModal(m);
      });
    });
    $$('[data-map-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-map-del');
        confirmModal({ title: 'ลบการกำหนดห้อง?', message: 'คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลครูประจำชั้นของห้องนี้', danger: true }).then(function (ok) {
          if (!ok) return;
          Spinner.show('กำลังลบ...');
          call('mapping.delete', { id: id }).then(function () {
            Spinner.hide(); toast('ลบเรียบร้อย', 'success'); Routes['#/settings/teachers']();
          }).catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
        });
      });
    });
  }

  function openMappingModal(m) {
    m = m || { academic_year: Store.academic_year || '' };
    var isNew = !m.id;
    var html = '<form id="map-form">'
      + '<div class="fg-2">'
      + field('ปีการศึกษา <span class="req">*</span>', '<input class="input" name="academic_year" value="' + esc(m.academic_year) + '" required maxlength="4" inputmode="numeric">')
      + '<div></div>'
      + '</div>'
      + '<div class="fg-2">'
      + field('ชั้น <span class="req">*</span>', '<input class="input" name="class_level" value="' + esc(m.class_level || '') + '" placeholder="เช่น ม.1" required>')
      + field('ห้อง <span class="req">*</span>', '<input class="input" name="room" value="' + esc(m.room || '') + '" placeholder="เช่น 1" required>')
      + '</div>'
      + field('ครูประจำชั้นคนที่ 1 <span class="req">*</span>', '<div style="display:flex;gap:6px"><input class="input" id="t1-display" value="' + esc(m.teacher1_name || '') + '" placeholder="คลิกเพื่อเลือกครู" readonly style="cursor:pointer"><button type="button" class="btn btn-ghost" id="t1-pick-btn"><i class="bi bi-search"></i></button></div><input type="hidden" name="teacher1_name" value="' + esc(m.teacher1_name || '') + '"><input type="hidden" name="teacher1_id" value="' + esc(m.teacher1_id || '') + '">')
      + field('ครูประจำชั้นคนที่ 2', '<div style="display:flex;gap:6px"><input class="input" id="t2-display" value="' + esc(m.teacher2_name || '') + '" placeholder="คลิกเพื่อเลือกครู (ถ้ามี)" readonly style="cursor:pointer"><button type="button" class="btn btn-ghost" id="t2-pick-btn"><i class="bi bi-search"></i></button></div><input type="hidden" name="teacher2_name" value="' + esc(m.teacher2_name || '') + '"><input type="hidden" name="teacher2_id" value="' + esc(m.teacher2_id || '') + '">')
      + '<input type="hidden" name="id" value="' + esc(m.id || '') + '">'
      + '</form>';

    Modal.open({
      title: isNew ? 'กำหนดครูประจำชั้น' : 'แก้ไขการกำหนดห้อง ' + m.class_level + '/' + m.room,
      html: html, large: true,
      footer: '<button class="btn btn-ghost" data-modal-close>ยกเลิก</button><button class="btn btn-primary" id="map-save"><i class="bi bi-check-lg"></i> บันทึก</button>',
      onOpen: function () {
        var pick1 = function() {
          var data = formToObj($('#map-form'));
          openTeacherPicker(function(u) {
            data.teacher1_name = u.full_name;
            data.teacher1_id = u.id;
            openMappingModal(data);
          });
        };
        var pick2 = function() {
          var data = formToObj($('#map-form'));
          openTeacherPicker(function(u) {
            data.teacher2_name = u.full_name;
            data.teacher2_id = u.id;
            openMappingModal(data);
          });
        };
        $('#t1-display').addEventListener('click', pick1);
        $('#t1-pick-btn').addEventListener('click', pick1);
        $('#t2-display').addEventListener('click', pick2);
        $('#t2-pick-btn').addEventListener('click', pick2);

        $('#map-save').addEventListener('click', function () {
          var data = formToObj($('#map-form'));
          if (!data.academic_year || !data.class_level || !data.room || !data.teacher1_name) {
            alertError('กรอกข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลที่จำเป็น (*) ให้ครบถ้วน'); return;
          }
          Spinner.show('กำลังบันทึก...');
          call('mapping.upsert', data).then(function () {
            Spinner.hide(); Modal.close(); toast('บันทึกเรียบร้อย', 'success'); Routes['#/settings/teachers']();
          }).catch(function (e) { Spinner.hide(); alertError('ผิดพลาด', e.message); });
        });
      }
    });
  }

  // ════════════════════════════════════════════════════════════
  // Helpers
  // ════════════════════════════════════════════════════════════
  function parseJSON(s, def) {
    if (!s) return def;
    if (typeof s !== 'string') return s;
    try { return JSON.parse(s); } catch (e) { return def; }
  }
  function radioRow(name, current, opts) {
    return '<div class="check-group">' + opts.map(function (o) {
      return '<label class="check-card' + (current === o.v ? ' is-checked' : '') + '"><input type="radio" name="' + name + '" value="' + esc(o.v) + '"' + (current === o.v ? ' checked' : '') + '><span>' + esc(o.l) + '</span></label>';
    }).join('') + '</div>';
  }
  function checkRow(name, current, label) {
    return '<label class="check-card' + (_yes(current) ? ' is-checked' : '') + '" style="margin-top:6px"><input type="checkbox" data-field="' + name + '"' + (_yes(current) ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  }
  function checkGroup(name, current, opts, captureAs) {
    current = current || [];
    return '<div class="check-group">' + opts.map(function (o) {
      var checked = current.indexOf(o.v) >= 0;
      return '<label class="check-card' + (checked ? ' is-checked' : '') + '"><input type="checkbox" data-checkgroup="' + (captureAs||name) + '" value="' + esc(o.v) + '"' + (checked ? ' checked' : '') + '><span>' + esc(o.l) + '</span></label>';
    }).join('') + '</div>';
  }
  function _yes(v) { var s = String(v||'').toLowerCase(); return s === 'yes' || s === 'true' || s === '1' || v === true; }
  function wireCheckCards() {
    $$('.check-card input').forEach(function (i) {
      i.addEventListener('change', function () {
        var card = i.closest('.check-card');
        if (i.type === 'radio') {
          var name = i.name;
          $$('input[name="' + name + '"]').forEach(function (j) {
            j.closest('.check-card').classList.toggle('is-checked', j.checked);
          });
        } else {
          card.classList.toggle('is-checked', i.checked);
        }
      });
    });
  }

  // Expose
  window.WIZ_renderWizard = renderWizard;

})();
</script>
<script type="text/x-shvr-core-print" id="shvr-print-script">
/* ═══════════════════════════════════════════════════════════════
   SHVR · Print Form Builder (4-page A4 official layout)

(function () {
  'use strict';
  var esc = window.esc, TH = window.TH;

  window.buildPrintForm = function (d) {

    function parseJSON(x, def) { if (!x) return def; if (typeof x !== 'string') return x; try { return JSON.parse(x); } catch (e) { return def; } }
    var _yes = function (x) { var str = String(x || "").toLowerCase(); return str === "yes" || str === "true" || str === "1" || x === true; };
    var statusDep = parseJSON(v.status_dependency, []);
    var housingCond = parseJSON(v.housing_condition, []);

    var hobbies = parseJSON(v.hobbies, []);
    var subs = parseJSON(v.substance_behavior, []);
    var viol = parseJSON(v.violence_behavior, []);
    var sex = parseJSON(v.sex_behavior, []);
    var game = parseJSON(v.game_addiction, []);
    var elec = parseJSON(v.electronics_use, []);
    var phType = parseJSON(v.photo_house_type, []);
    var reportCats = parseJSON(v.student_report_categories, []);
    var riskCats = parseJSON(v.student_risk_categories, []);

    function chk(arr, val, label) {
      var ok = (arr||[]).indexOf(val) >= 0;
      return '<span class="pr-checkmark' + (ok ? ' checked' : '') + '"></span> ' + esc(label);
    }
    function rad(cur, val, label) {
      return '<span class="pr-radio' + (cur === val ? ' checked' : '') + '"></span> ' + esc(label);
    }
    function chkBox(ok) { return '<span class="pr-checkmark' + (ok ? ' checked' : '') + '"></span>'; }
    function radBox(ok) { return '<span class="pr-radio' + (ok ? ' checked' : '') + '"></span>'; }
    function idBoxes(num) {
      var s = String(num||'').padEnd(13, ' ');
      var html = '<span class="pr-id-boxes">';
      for (var i = 0; i < 13; i++) {
        html += '<span class="pr-id-box">' + esc(s.charAt(i).trim()) + '</span>';
        if (i === 0 || i === 4 || i === 9 || i === 11) html += '<span class="pr-id-sep">-</span>';
      }
      html += '</span>';
      return html;
    }

    var html = '<div class="print-doc">';
    // Toolbar
    html += '<div class="print-toolbar"><div class="pt-title"><i class="bi bi-printer-fill"></i> ' + esc(v.visit_code||'') + ' · ' + esc((s.prefix||'') + (s.first_name||'') + ' ' + (s.last_name||'')) + '</div>'
      + '<div class="pt-actions">'
      + '<a class="btn btn-ghost" href="#/visits"><i class="bi bi-arrow-left"></i> กลับ</a>'
      + '<button class="btn btn-ghost" id="pr-save-drive"><i class="bi bi-cloud-arrow-up-fill"></i> บันทึกลง Drive</button>'
      + '<button class="btn btn-primary" id="pr-do-print"><i class="bi bi-printer-fill"></i> พิมพ์ / บันทึก PDF</button>'
      + '</div></div>';

    var logoHtml = settings.org_logo_url ? '<div style="text-align:center;margin-bottom:8px"><img src="' + esc(settings.org_logo_url) + '" style="width:60px;height:60px;object-fit:contain"></div>' : '';

    // ── PAGE 1 ──
    html += '<div class="pr-page">'
      + logoHtml
      + '<div class="pr-head"><div style="width:60px"></div><div class="pr-head-title">บันทึกการเยี่ยมบ้าน</div><div class="pr-head-page">หน้า 1/4</div></div>'
      + '<div class="pr-section" style="font-size:12px">'
      + '<strong>คำชี้แจง :</strong><br>'
      + '● แบบบันทึกการเยี่ยมบ้านฉบับนี้รวมการคัดกรองนักเรียนยากจนเข้าด้วยกัน เพื่อให้คุณครูสามารถลงพื้นที่ได้พร้อมกันในครั้งเดียว<br>'
      + '● การตอบแบบสอบถาม : หากเป็นตัวเลือก ○ หมายถึง ให้ตอบเพียงข้อเดียว และ ☐ หมายถึง ให้ตอบได้มากกว่า 1 ข้อ'
      + '</div>'
      // School + photo
      + '<div style="display:flex;gap:10px;align-items:flex-start;margin:10px 0">'
      + '<div style="flex:1">'
      + '<div class="pr-row"><span class="lbl">โรงเรียน</span><span class="val">' + esc(v.school_name||settings.org_name||'') + '</span><span class="lbl">สพป./สพม.</span><span class="val">' + esc(v.education_area||settings.education_area||'') + '</span></div>'
      + '<div class="pr-row"><span class="lbl">1. ชื่อนักเรียน</span><span class="val">' + esc((s.prefix||'') + (s.first_name||'')) + '</span><span class="lbl">นามสกุล</span><span class="val">' + esc(s.last_name||'') + '</span><span class="lbl">ชั้น</span><span class="val">' + esc((s.class_level||'') + (s.room ? '/'+s.room : '')) + '</span></div>'
      + '<div class="pr-row"><span class="lbl">เลขที่บัตรประชาชน</span>' + idBoxes(s.citizen_id) + '</div>'
      + '<div class="pr-row"><span class="lbl">2. ชื่อผู้ปกครอง</span><span class="val">' + esc(v.guardian_first_name||'') + '</span><span class="lbl">นามสกุล</span><span class="val">' + esc(v.guardian_last_name||'') + '</span><span class="lbl">โทรศัพท์</span><span class="val">' + esc(v.guardian_phone||'') + '</span>' + radBox(v.has_guardian === 'no') + ' ไม่มีผู้ปกครอง</div>'
      + '<div class="pr-row"><span class="lbl">ความสัมพันธ์</span><span class="val">' + esc(v.guardian_relation||'') + '</span><span class="lbl">อาชีพ</span><span class="val">' + esc(v.guardian_occupation||'') + '</span><span class="lbl">การศึกษาสูงสุด</span><span class="val">' + esc(v.guardian_education||'') + '</span></div>'
      + '<div class="pr-row"><span class="lbl">เลขที่บัตรประชาชน</span>' + idBoxes(v.guardian_citizen_id) + ' ' + chkBox(_yes(v.guardian_no_id)) + ' ไม่มีบัตรประจำตัวประชาชน</div>'
      + '<div class="pr-row">' + chkBox(_yes(v.guardian_welfare_registered)) + ' เคยลงทะเบียนเพื่อสวัสดิการแห่งรัฐ (ลงทะเบียนคนจน)</div>'
      + '</div>'
      + '<div class="pr-photo-box">' + (v.photo_student||s.photo_url ? '<img src="' + esc(v.photo_student||s.photo_url) + '">' : 'รูปถ่ายนักเรียน') + '</div>'
      + '</div>'
      // Section 3 income table
      + '<div class="pr-section">'
