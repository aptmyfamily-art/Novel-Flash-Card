<script>
/**
 * Novel Flashcard page handlers.
 * Keeps the Home Visit dashboard feel while replacing the domain flow
 * with "paste text -> create Google Docs".
 */
(function () {
  'use strict';

  var $ = window.$ || function (s, r) { return (r || document).querySelector(s); };
  var $$ = window.$$ || function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = window.esc;
  var call = window.call;
  var Store = window.Store;
  var Routes = window.Routes;
  var Modal = window.Modal;
  var Spinner = window.Spinner;
  var alertSuccess = window.alertSuccess;
  var alertError = window.alertError;
  var alertWarning = window.alertWarning;
  var pageHero = window.pageHero;
  var formatNum = window.formatNum || function (n) { return String(n || 0); };

  Routes['#/dashboard'] = function RenderDashboard() {
    var page = $('#page');
    if (!page) return;

    var navTitle = $('#nav-page-title');
    var navSub = $('#nav-page-sub');
    var navIcon = $('#nav-page-icon');
    if (navTitle) navTitle.textContent = 'แดชบอร์ด';
    if (navSub) navSub.textContent = 'สร้าง Google Docs จากข้อความนิยายโดยอิงหน้าตาระบบเดิม';
    if (navIcon) navIcon.innerHTML = '<i class="bi bi-grid-fill"></i>';

    var orgName = (Store.boot && Store.boot.settings && Store.boot.settings.org_name) || 'Novel Flashcard';
    var kpis = [
      { val: '1', lbl: 'Workflow หลัก', icon: 'bi-lightning-charge-fill', color1: '#6366f1', color2: '#8b5cf6' },
      { val: 'Docs', lbl: 'รูปแบบปลายทาง', icon: 'bi-file-earmark-text-fill', color1: '#10b981', color2: '#059669' },
      { val: 'Drive', lbl: 'พื้นที่จัดเก็บ', icon: 'bi-cloud-arrow-up-fill', color1: '#0ea5e9', color2: '#0284c7' },
      { val: 'Text', lbl: 'ข้อมูลนำเข้า', icon: 'bi-input-cursor-text', color1: '#f59e0b', color2: '#d97706' }
    ];

    var html = pageHero(
      'คลังคำศัพท์นิยาย',
      'วางข้อความนิยายรายตอน แล้วบันทึกขึ้น Google Drive เป็น Docs',
      'bi-house-fill',
      kpis
    );

    html += '<div class="card" style="margin-bottom:16px"><h3 class="card-title"><i class="bi bi-lightning-charge-fill" style="color:#f59e0b"></i> เมนูด่วน</h3>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px">'
      + qaCard('bi-file-earmark-plus-fill', 'สร้างเอกสารจากข้อความ', '#6366f1', '#8b5cf6', 'open-doc-modal')
      + qaCard('bi-clipboard-check-fill', 'วางเนื้อหารายตอน', '#0ea5e9', '#0284c7', 'focus-doc-editor')
      + qaCard('bi-folder2-open', 'ใช้โฟลเดอร์ episodes', '#10b981', '#059669', 'prefill-episodes')
      + qaCard('bi-diagram-3-fill', 'จัดเป็นโฟลเดอร์ย่อย', '#f59e0b', '#d97706', 'prefill-nested')
      + '</div></div>';

    html += '<div class="card" style="margin-bottom:16px"><h3 class="card-title"><i class="bi bi-journal-richtext" style="color:#6366f1"></i> พื้นที่เตรียมต้นฉบับ</h3>'
      + '<div class="toolbar">'
      + '<div class="search" style="flex:1;max-width:none"><i class="bi bi-pencil-square"></i><input class="input" id="doc-title-inline" placeholder="ชื่อตอน / ชื่อเอกสาร"></div>'
      + '<input class="input" id="doc-folder-inline" value="episodes" placeholder="โฟลเดอร์ย่อย เช่น novels/เรื่องA/episodes" style="max-width:280px">'
      + '<button class="btn btn-primary" id="doc-open-modal"><i class="bi bi-box-arrow-in-up-right"></i> เปิดฟอร์มบันทึก</button>'
      + '</div>'
      + '<div style="margin-top:14px">'
      + '<textarea class="textarea" id="doc-content-inline" style="min-height:280px" placeholder="วางข้อความนิยายรายตอนที่นี่..."></textarea>'
      + '</div>'
      + '<div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
      + '<button class="btn btn-primary" id="doc-save-inline"><i class="bi bi-file-earmark-text-fill"></i> สร้าง Google Docs</button>'
      + '<button class="btn btn-ghost" id="doc-clear-inline"><i class="bi bi-eraser"></i> ล้างข้อความ</button>'
      + '<span id="doc-inline-status" style="font-size:13px;color:var(--ink-muted)">พร้อมรับข้อความ</span>'
      + '</div>'
      + '<div id="doc-inline-result" style="display:none;margin-top:14px"></div>'
      + '</div>';

    html += '<div class="card"><h3 class="card-title"><i class="bi bi-info-circle-fill" style="color:#0ea5e9"></i> แนวทางการใช้งาน</h3>'
      + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">'
      + infoBox('1. วางข้อความ', 'นำข้อความนิยายรายตอนมาวางลงใน textarea ได้ตรง ๆ')
      + infoBox('2. ตั้งชื่อเอกสาร', 'ใช้ชื่อตอนหรือ slug ชั่วคราวก่อนแยก metadata ทีหลัง')
      + infoBox('3. บันทึกขึ้น Drive', 'ระบบจะสร้าง Google Docs และย้ายเข้าโฟลเดอร์ย่อยให้')
      + infoBox('4. จัดตามโฟลเดอร์', 'รองรับ path หลายชั้น เช่น novels/เรื่องA/episodes')
      + '</div>'
      + '<div style="margin-top:14px;font-size:12px;color:var(--ink-muted)">ปลายทางปัจจุบัน: <strong>' + esc(orgName) + '</strong> / โฟลเดอร์ preview ของแอป</div>'
      + '</div>';

    page.innerHTML = html;
    wireDashboardDocFlow();
  };

  function qaCard(icon, label, c1, c2, action) {
    return '<button type="button" class="qa-card" data-doc-action="' + esc(action) + '" style="border:0;background:transparent;padding:0;text-align:left;cursor:pointer">'
      + '<div class="qa-card-inner">'
      + '<div class="qa-card-icon" style="background:linear-gradient(135deg,' + c1 + ',' + c2 + ');box-shadow:0 8px 16px ' + c1 + '40"><i class="bi ' + icon + '"></i></div>'
      + '<div class="qa-card-label">' + esc(label) + '</div></div></button>';
  }

  function infoBox(title, desc) {
    return '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff">'
      + '<div style="font-weight:700;font-size:13px;color:var(--ink)">' + esc(title) + '</div>'
      + '<div style="font-size:12px;color:var(--ink-muted);margin-top:6px;line-height:1.6">' + esc(desc) + '</div>'
      + '</div>';
  }

  function wireDashboardDocFlow() {
    var titleEl = $('#doc-title-inline');
    var folderEl = $('#doc-folder-inline');
    var contentEl = $('#doc-content-inline');
    var saveBtn = $('#doc-save-inline');
    var clearBtn = $('#doc-clear-inline');
    var openBtn = $('#doc-open-modal');

    if (saveBtn) saveBtn.addEventListener('click', submitInlineDoc);
    if (openBtn) openBtn.addEventListener('click', openDocModal);
    if (clearBtn) clearBtn.addEventListener('click', function () {
      if (contentEl) contentEl.value = '';
      setInlineStatus('ล้างข้อความแล้ว');
      var result = $('#doc-inline-result');
      if (result) { result.style.display = 'none'; result.innerHTML = ''; }
    });

    $$('[data-doc-action]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var action = btn.getAttribute('data-doc-action');
        if (action === 'open-doc-modal') openDocModal();
        if (action === 'focus-doc-editor' && contentEl) contentEl.focus();
        if (action === 'prefill-episodes' && folderEl) {
          folderEl.value = 'episodes';
          setInlineStatus('ตั้งค่าโฟลเดอร์เป็น episodes แล้ว');
        }
        if (action === 'prefill-nested' && folderEl) {
          folderEl.value = 'novels/เรื่องใหม่/episodes';
          setInlineStatus('ตั้งค่าโฟลเดอร์แบบหลายชั้นแล้ว');
        }
      });
    });

    function buildPayload() {
      return {
        title: String((titleEl && titleEl.value) || '').trim(),
        subfolder: String((folderEl && folderEl.value) || 'episodes').trim() || 'episodes',
        content: String((contentEl && contentEl.value) || '')
      };
    }

    function submitInlineDoc() {
      submitDocPayload(buildPayload(), function (doc) {
        renderInlineResult(doc);
      });
    }

    function openDocModal() {
      var payload = buildPayload();
      Modal.open({
        title: 'สร้าง Google Docs จากข้อความนิยาย',
        large: true,
        html: ''
          + '<form id="doc-modal-form">'
          + field('ชื่อเอกสาร', '<input class="input" name="title" value="' + esc(payload.title) + '" placeholder="เช่น ตอนที่ 1 - จุดเริ่มต้น">')
          + field('โฟลเดอร์ย่อยใน Drive', '<input class="input" name="subfolder" value="' + esc(payload.subfolder) + '" placeholder="episodes หรือ novels/เรื่องA/episodes">')
          + field('เนื้อหานิยาย', '<textarea class="textarea" name="content" style="min-height:320px">' + esc(payload.content) + '</textarea>')
          + '<div id="doc-modal-status" style="font-size:12px;color:var(--ink-muted)">พร้อมบันทึก</div>'
          + '<div id="doc-modal-result" style="display:none;margin-top:12px"></div>'
          + '</form>',
        footer: '<button class="btn btn-ghost" data-modal-close>ยกเลิก</button><button class="btn btn-primary" id="doc-modal-save"><i class="bi bi-check-lg"></i> บันทึกขึ้น Google Docs</button>',
        onOpen: function () {
          var save = $('#doc-modal-save');
          if (!save) return;
          save.addEventListener('click', function () {
            var form = $('#doc-modal-form');
            if (!form) return;
            var modalPayload = {
              title: String(form.title.value || '').trim(),
              subfolder: String(form.subfolder.value || 'episodes').trim() || 'episodes',
              content: String(form.content.value || '')
            };
            submitDocPayload(modalPayload, function (doc) {
              if (titleEl) titleEl.value = modalPayload.title;
              if (folderEl) folderEl.value = modalPayload.subfolder;
              if (contentEl) contentEl.value = modalPayload.content;
              renderModalResult(doc);
            });
          });
        }
      });
    }

    function submitDocPayload(payload, onSuccess) {
      if (!payload.title) {
        alertWarning('ยังไม่ได้ตั้งชื่อเอกสาร', 'กรุณาระบุชื่อเอกสารก่อนบันทึก');
        return;
      }
      if (!payload.content.trim()) {
        alertWarning('ยังไม่มีข้อความ', 'กรุณาวางเนื้อหานิยายก่อนอัปโหลด');
        return;
      }

      setInlineStatus('กำลังสร้าง Google Docs...');
      setModalStatus('กำลังสร้าง Google Docs...');
      if (saveBtn) saveBtn.disabled = true;
      if (Spinner) {
        Spinner.show('กำลังสร้างเอกสาร...', {
          stages: ['สร้างไฟล์', 'บันทึกข้อความ', 'ย้ายเข้าโฟลเดอร์ Drive']
        });
      }

      call('file.create_doc', payload, 60000).then(function (doc) {
        setInlineStatus('สร้างเอกสารสำเร็จ');
        setModalStatus('สร้างเอกสารสำเร็จ');
        if (typeof onSuccess === 'function') onSuccess(doc);
        alertSuccess('อัปโหลดสำเร็จ', 'สร้าง Google Docs เรียบร้อยแล้ว');
      }).catch(function (e) {
        setInlineStatus('สร้างเอกสารไม่สำเร็จ');
        setModalStatus('สร้างเอกสารไม่สำเร็จ');
        alertError('สร้าง Google Docs ไม่สำเร็จ', e.message || 'เกิดข้อผิดพลาด');
      }).finally(function () {
        if (saveBtn) saveBtn.disabled = false;
        if (Spinner) Spinner.hide();
      });
    }

    function renderInlineResult(doc) {
      var result = $('#doc-inline-result');
      if (!result) return;
      result.style.display = 'block';
      result.innerHTML = successBox(doc);
    }

    function renderModalResult(doc) {
      var result = $('#doc-modal-result');
      if (!result) return;
      result.style.display = 'block';
      result.innerHTML = successBox(doc);
    }
  }

  function successBox(doc) {
    return '<div class="card" style="margin:0;background:#f8fafc">'
      + '<div style="font-weight:700;color:#0f172a;margin-bottom:8px"><i class="bi bi-check-circle-fill" style="color:#16a34a;margin-right:8px"></i>' + esc(doc.name || '-') + '</div>'
      + '<div style="font-size:13px;color:#475569;margin-bottom:4px">คำโดยประมาณ: ' + esc(String(doc.word_count || 0)) + ' คำ</div>'
      + '<div style="font-size:13px;color:#475569;margin-bottom:12px">โฟลเดอร์: ' + esc(doc.subfolder || '-') + '</div>'
      + '<a class="btn btn-primary btn-sm" href="' + esc(doc.url) + '" target="_blank" rel="noopener noreferrer"><i class="bi bi-box-arrow-up-right"></i> เปิด Google Docs</a>'
      + '</div>';
  }

  function field(label, input) {
    return '<div class="field" style="margin-bottom:14px"><label class="label" style="display:block;margin-bottom:6px;font-weight:700;font-size:13px;color:var(--ink)">' + esc(label) + '</label>' + input + '</div>';
  }

  function setInlineStatus(text) {
    var el = $('#doc-inline-status');
    if (el) el.textContent = text;
  }

  function setModalStatus(text) {
    var el = $('#doc-modal-status');
    if (el) el.textContent = text;
  }

  if (window.location && (window.location.hash === '#/dashboard' || !window.location.hash || window.location.hash === '#/')) {
    setTimeout(function () {
      if (Routes['#/dashboard']) Routes['#/dashboard']();
    }, 100);
  }
})();
</script>
