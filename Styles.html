<style>
  :root {
    --bg: #f4f5ef;
    --panel: #fffef8;
    --ink: #1f241d;
    --line: #d8dcc8;
    --brand: #284b63;
    --accent: #ffb703;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--ink);
    background: radial-gradient(circle at top right, #fbf7df, var(--bg) 55%);
    font-family: "Noto Sans Thai", "Segoe UI", sans-serif;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: var(--brand);
    color: #fff;
  }
  .topbar h1 { margin: 0; font-size: 20px; }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .top-actions button {
    width: auto;
    padding: 6px 10px;
    background: #f3d26a;
  }
  .layout {
    display: grid;
    grid-template-columns: 280px 320px 1fr;
    gap: 12px;
    padding: 12px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
  }
  h2, h3 { margin: 6px 0 10px; }
  .stack { display: grid; gap: 8px; margin-bottom: 10px; }
  input, textarea, select, button {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    font: inherit;
  }
  textarea { min-height: 90px; }
  button {
    background: var(--accent);
    border: 0;
    cursor: pointer;
    font-weight: 700;
  }
  .reader {
    min-height: 300px;
    white-space: pre-wrap;
    line-height: 2;
    font-size: 22px;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
    background: #fff;
  }
  .zi {
    display: inline-block;
    padding: 0 1px;
    border-radius: 4px;
  }
  .zi:hover {
    background: #ffe7a8;
    cursor: pointer;
  }
  .popup {
    position: fixed;
    z-index: 20;
    width: 320px;
    background: #fff;
    border: 1px solid var(--line);
    border-left: 5px solid var(--brand);
    border-radius: 8px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
    padding: 10px;
  }
  .popup .row { display: grid; gap: 8px; margin-top: 8px; }
  .fav-list {
    max-height: 220px;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    background: #fff;
  }
  .fav-item {
    border-bottom: 1px dashed var(--line);
    padding: 6px 0;
  }
  @media (max-width: 980px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
