<style>
:root {
  --brand-1: #6366f1;
  --brand-2: #8b5cf6;
  --brand-3: #a855f7;
  --ink: #1e293b;
  --ink-muted: #64748b;
  --line: #e2e8f0;
  --bg: #f8fafc;
  --panel: #ffffff;
  --shadow-sm: 0 2px 4px rgba(15,23,42,.06);
  --shadow-md: 0 12px 28px rgba(15,23,42,.11);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font-family: "Kanit","Sarabun",system-ui,sans-serif; min-height: 100vh; }

.boot-loader {
  position: fixed; inset: 0; z-index: 999;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg,#0f172a,#1e293b,#312e81);
  color: #fff;
}
.bl-logo {
  width: 80px; height: 80px; border-radius: 22px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6,#a855f7);
  display: flex; align-items: center; justify-content: center;
  font-size: 42px;
  box-shadow: 0 20px 50px rgba(99,102,241,.5);
}
.bl-name { font-size: 26px; font-weight: 800; margin-top: 18px; }
.bl-sub { font-size: 13px; color: rgba(255,255,255,.72); }
.bl-dots { margin-top: 18px; display: flex; gap: 6px; }
.bl-dots span {
  width: 10px; height: 10px; border-radius: 50%; background: #a5b4fc;
  animation: blBounce 1.4s ease-in-out infinite;
}
.bl-dots span:nth-child(2) { animation-delay: .2s; }
.bl-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blBounce { 0%,80%,100% { transform: scale(.6); opacity: .5; } 40% { transform: scale(1); opacity: 1; } }
.bl-text { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,.65); }

.topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px;
  background: linear-gradient(135deg,var(--brand-1),var(--brand-2),var(--brand-3));
  color: #fff;
  box-shadow: var(--shadow-md);
}
.topbar h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
.top-actions { display: flex; gap: 10px; align-items: center; }
.top-actions #status {
  padding: 7px 10px; border-radius: 10px;
  background: rgba(255,255,255,.18); font-size: 12px;
}

input, textarea, select, button {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 10px;
  font: inherit;
}
button {
  border: 0;
  color: #fff;
  background: linear-gradient(135deg,var(--brand-1),var(--brand-2));
  cursor: pointer;
}

.layout {
  display: grid;
  grid-template-columns: 220px 290px 340px 1fr;
  gap: 12px;
  padding: 12px;
}
.sidebar {
  background: linear-gradient(180deg,#1f1d5a 0%, #252266 45%, #2c2972 100%);
  color: #fff;
  border-radius: 14px;
  padding: 14px;
  box-shadow: var(--shadow-md);
  position: sticky;
  top: 12px;
  height: fit-content;
}
.sb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,.12);
}
.sb-logo {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: linear-gradient(135deg,#6366f1,#a855f7);
  display: flex;
  align-items: center;
  justify-content: center;
}
.sb-title { font-size: 14px; font-weight: 700; }
.sb-sub { font-size: 11px; opacity: .7; }
.sb-section {
  margin-top: 16px;
  margin-bottom: 8px;
  font-size: 12px;
  font-weight: 700;
  opacity: .75;
}
.sb-nav {
  display: grid;
  gap: 8px;
}
.sb-nav a {
  color: #fff;
  text-decoration: none;
  padding: 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(255,255,255,.06);
  font-weight: 600;
}
.sb-nav a:hover { background: rgba(255,255,255,.14); }
.sb-nav a.is-active {
  background: linear-gradient(135deg, rgba(99,102,241,.5), rgba(139,92,246,.5));
  border-color: rgba(255,255,255,.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
}
.sb-quick {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.12);
  display: grid;
  gap: 8px;
}
.sb-quick-title {
  font-size: 12px;
  opacity: .75;
}
.sb-quick button {
  width: 100%;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.1);
  color: #fff;
  border-radius: 10px;
  padding: 9px 10px;
  text-align: left;
}
.sb-quick button:hover { background: rgba(255,255,255,.2); }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow-sm);
  padding: 12px;
}
h2, h3 { margin: 6px 0 10px; }
.stack { display: grid; gap: 8px; margin-bottom: 10px; }
textarea { min-height: 94px; resize: vertical; }

.reader {
  min-height: 300px;
  white-space: pre-wrap;
  line-height: 2;
  font-size: 22px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  background: #fff;
}
.zi { display: inline-block; border-radius: 4px; padding: 0 1px; }
.zi:hover { background: #e9e9ff; cursor: pointer; }

.popup {
  position: fixed; z-index: 20; width: 320px; padding: 10px;
  background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--brand-1);
  border-radius: 10px; box-shadow: var(--shadow-md);
}
.popup .row { display: grid; gap: 8px; margin-top: 8px; }

.fav-list {
  max-height: 220px; overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
}
.fav-item { border-bottom: 1px dashed var(--line); padding: 6px 0; }

.spinner-overlay {
  position: fixed; inset: 0; z-index: 9000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(15,23,42,.6); backdrop-filter: blur(8px);
}
.spinner-overlay[hidden] { display: none !important; }
.qspin { position: relative; width: 140px; height: 140px; }
.qspin-ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; }
.qspin-r1 { border-top-color: var(--brand-1); animation: qSpin 1.5s linear infinite; }
.qspin-r2 { inset: 12px; border-bottom-color: var(--brand-2); animation: qSpin 1.8s linear infinite reverse; }
.qspin-r3 { inset: 24px; border-left-color: var(--brand-3); animation: qSpin 1.2s linear infinite; }
@keyframes qSpin { to { transform: rotate(360deg); } }
.qspin-pulse {
  position: absolute; inset: 30px; border-radius: 50%;
  background: radial-gradient(circle, rgba(99,102,241,.3), transparent 70%);
}
.qspin-core {
  position: absolute; inset: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 24px;
  background: linear-gradient(135deg,var(--brand-1),var(--brand-2));
}
.qspin-msg { color: #fff; margin-top: 16px; font-size: 15px; font-weight: 600; }

@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: static; }
}
</style>
